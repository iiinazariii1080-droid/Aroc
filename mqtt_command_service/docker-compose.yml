services:
  mqtt_command_service:
    build: .
    container_name: mqtt_command_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Path to configuration DB on host (outside container)
      - CONFIG_DB_PATH=/app/data/config.db
      # API configuration (can be overridden in .env)
      - API_ENABLED=${API_ENABLED:-true}
      - API_PORT=${API_PORT:-7900}
      - API_HOST=${API_HOST:-0.0.0.0}
      # Certificate storage
      - CERT_STORAGE_DIR=/app/certs
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JSON_LOGS=${JSON_LOGS:-false}
    volumes:
      # Mount directory with configuration DB (located outside container)
      - ./data:/app/data
      # .env is loaded via env_file directive above; no volume mount needed
      # Mount certificates directory (if TLS is used)
      - ./certs:/app/certs
    ports:
      # Expose API port (only if API_ENABLED=true)
      - "${API_PORT:-7900}:${API_PORT:-7900}"
    networks:
      - default
    # Health check
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"