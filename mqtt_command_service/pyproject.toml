[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--ignore=tests/test_property_based.py -q --tb=short"

[tool.coverage.run]
source = [".", "app"]
omit = [
    "tests/*",
    "htmlcov/*",
    "scripts/*",
    "artifacts/*",
    "docs/*",
    ".venv/*",
    "setup.py",
    "verify_endpoints.py",
    "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "htmlcov",
    "artifacts",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in argument defaults (FastAPI Depends)
    "B904",   # raise ... from (too many false positives in legacy code)
    "SIM108", # use ternary operator (readability preference)
    "UP007",  # use X | Y for union (need 3.10+)
    "RUF012", # mutable class variables (dataclass fields)
    "RUF001", # ambiguous unicode in strings (intentional: ℹ icon)
    "RUF002", # ambiguous unicode in docstrings (en-dash in comments)
    "RUF003", # ambiguous unicode in comments (multiplication sign)
    "E402",   # module-level import not at top (test files need setup before imports)
    "SIM102", # collapsible-if (readability preference in migration code)
    "SIM117", # nested with statements (already using parenthesized form where needed)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "bridge", "telemetry", "constants", "utils", "auth"]

