<!DOCTYPE html>
<html lang="en" style="overflow: hidden; height: 105%;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-family: sans-serif;
      background-color: #ffffff;
      transform-origin: top left;
      transform: scale(1);
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      padding-left: 2vw;
      width: 100%;
      height: 100%;
      min-height: 0;
      z-index: 1000;
      box-sizing: border-box;
      position: static;
    }
    .status-left {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .status-right {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .settings-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 70%;
      aspect-ratio: 1/1;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .settings-button:hover {
      background: #f0f1f3;
    }
    .settings-button svg {
      width: 1.2em;
      height: 1.2em;
      fill: #000000;
      transition: transform 0.3s ease;
      display: block;
    }
    .settings-button:hover svg {
      transform: rotate(30deg);
    }
    .status-item {
      height: 70%;
      display: flex;
      align-items: center;
      margin-left: 2vw;
      color: #000000;
      font-size: 1em;
      transform: scale(1);
    }
    .status-item:first-child {
      margin-left: 0;
    }
    .status-item svg, .status-item img, .device-icon {
      height: 100%;
      max-height: 1.5em;
      width: auto;
      max-width: 2em;
      object-fit: contain;
      display: block;
      vertical-align: middle;
    }
    .device-icon.error {
      opacity: 0.5;
    }
    .battery-percentage {
      margin-left: 0.5em;
      font-size: 0.9em;
    }
    .battery-fill {
      fill: green; 
      transition: height 0.3s ease, y 0.3s ease, fill 0.3s ease;
    }
    .charging-icon {
      display: none;
    }
    /* Safety lockout banner */
    #safety-banner {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: #d32f2f;
      color: #fff;
      font-weight: bold;
      font-size: 0.95em;
      z-index: 2000;
      align-items: center;
      justify-content: center;
      gap: 1em;
      padding: 0 2vw;
    }
    #safety-banner.recovery-available {
      background: #f9a825;
      color: #000;
    }
    #safety-banner .recover-btn {
      background: #fff;
      color: #d32f2f;
      border: none;
      border-radius: 4px;
      padding: 0.25em 1em;
      font-weight: bold;
      font-size: 0.9em;
      cursor: pointer;
    }
    #safety-banner.recovery-available .recover-btn {
      color: #000;
    }
    #safety-banner .recover-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }
  </style>
</head>
<body>
  <div id="safety-banner">
    <span id="safety-text">⚠ E-STOP ACTIVE</span>
    <button class="recover-btn" id="recover-btn" style="display:none;">Восстановить</button>
  </div>
  <div class="status-bar">
    <div class="status-left">
      <button class="settings-button" id="settings-button">
        <svg viewBox="0 0 24 24">
          <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
        </svg>
      </button>
    </div>
    <div class="status-right">
      <div class="status-item">
        <img id="car-icon" class="device-icon" src="/static/js/topbar/icons/car.svg" alt="Car Status">
      </div>
      <div class="status-item">
        <img id="lift-icon" class="device-icon" src="/static/js/topbar/icons/lift.svg" alt="Lift Status">
      </div>
      <div class="status-item">
        <img id="manipulator-icon" class="device-icon" src="/static/js/topbar/icons/manipulator.svg" alt="Manipulator Status">
      </div>
      <div class="status-item wifi-icon">
        <img src="/static/js/topbar/icons/wifi_on.svg" alt="Wi-Fi Icon">
      </div>
      <div class="status-item battery">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2" width="6" height="2" fill="black"></rect>
          <rect x="7" y="4" width="10" height="18" rx="2" ry="2" stroke="black" stroke-width="1" fill="none"></rect>
          <rect class="battery-fill" x="7" y="22" width="10" height="0"></rect>
        </svg>
        <div class="battery-percentage">--%</div>
      </div>
      <div class="status-item charge">
        <div class="charging-icon" style="width: 24px;display: flex;margin-left: -1vw;padding-right: 2vw;">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 3v7h7l-9 11v-7H4l9-11z"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('settings-button').addEventListener('click', function() {
      window.open('/static/js/topbar/keyboard-config.html', 'Keyboard Config', 'width=800,height=600');
    });
    async function updateStatusBar() {
      try {
        const robotData = await fetch("/api/v1/robot/status").then(res => res.json());

        const batteryText = document.querySelector(".battery-percentage");
        const batteryFillRect = document.querySelector(".battery-fill");
        const chargingIcon = document.querySelector(".charging-icon");

        const levelPercent = robotData.symovo.battery_level_percent;
        batteryText.textContent = levelPercent.toFixed(0) + "%";
        const totalHeight = 18;
        const fillHeight = totalHeight * (robotData.symovo.battery_level_percent / 100);
        const fillY = 22 - fillHeight;
        batteryFillRect.setAttribute("y", fillY.toFixed(1));
        batteryFillRect.setAttribute("height", fillHeight.toFixed(1));
        if (levelPercent < 20) {
          batteryFillRect.setAttribute("fill", "red");
        } else if (levelPercent < 50) {
          batteryFillRect.setAttribute("fill", "orange");
        } else {
          batteryFillRect.setAttribute("fill", "green");
        }


        // ========= Молния (признак зарядки) =========
        // Если reed_closed = true => показываем
        if (robotData.symovo.state_flags && robotData.symovo.state_flags.reed_closed === true) {
          chargingIcon.style.display = "flex";
        } else {
          chargingIcon.style.display = "none";
        }

        const carIcon = document.getElementById("car-icon");
        const liftIcon = document.getElementById("lift-icon");
        const manipulatorIcon = document.getElementById("manipulator-icon");
        // Check for symovo errors - look for various error conditions
        const hasSymovoError = !robotData.symovo.online || 
                              robotData.symovo.state === "error" ||
                              (robotData.symovo.state_flags && (
                                robotData.symovo.state_flags.backend_error ||
                                robotData.symovo.state_flags.odom_timeout ||
                                robotData.symovo.state_flags.imu_timeout ||
                                robotData.symovo.state_flags.laser_timeout
                              ));
        
        if (hasSymovoError) {
          carIcon.src = "/static/js/topbar/icons/car_error.svg";
          carIcon.classList.add("error");
        } else {
          carIcon.src = "/static/js/topbar/icons/car.svg";
          carIcon.classList.remove("error");
        }
        if (robotData.igus.error || !robotData.igus.homed) {
          liftIcon.src = "/static/js/topbar/icons/lift_error.svg";
          liftIcon.classList.add("error");
        } else {
          liftIcon.src = "/static/js/topbar/icons/lift.svg";
          liftIcon.classList.remove("error");
        }
        // Check for xarm errors - the data structure is different
        const xarmData = robotData.xarm.data;
        const hasXarmError = !xarmData || !xarmData[0] || // First element indicates if device is connected
                            (xarmData[25] && xarmData[25].code !== 0) || // Error code check
                            (xarmData[26] && xarmData[26].code !== 0); // Warning code check
        
        if (hasXarmError) {
          manipulatorIcon.src = "/static/js/topbar/icons/manipulator_error.svg";
          manipulatorIcon.classList.add("error");
        } else {
          manipulatorIcon.src = "/static/js/topbar/icons/manipulator.svg";
          manipulatorIcon.classList.remove("error");
        }

        // Safety lockout banner
        updateSafetyBanner(robotData.symovo && robotData.symovo.state_flags);
      } catch (error) {
        console.error("Ошибка при обновлении статуса:", error);
      }
    }

    // Safety lockout banner logic
    const safetyBanner = document.getElementById("safety-banner");
    const safetyText = document.getElementById("safety-text");
    const recoverBtn = document.getElementById("recover-btn");

    function updateSafetyBanner(stateFlags) {
      if (!stateFlags) { safetyBanner.style.display = "none"; return; }
      const estop = stateFlags.emergency_stop === true;
      const relayOpen = stateFlags.safety_relais_closed_state === false;
      const locked = estop || relayOpen;
      if (!locked) { safetyBanner.style.display = "none"; return; }
      safetyBanner.style.display = "flex";
      if (estop) {
        safetyBanner.classList.remove("recovery-available");
        safetyText.textContent = "⚠ E-STOP ACTIVE — release button to proceed";
        recoverBtn.style.display = "none";
      } else {
        // Relay open but E-Stop not flagged — may be recoverable after relay reset
        safetyBanner.classList.add("recovery-available");
        safetyText.textContent = "⚠ SAFETY RELAY OPEN — reset relay, then recover";
        recoverBtn.style.display = "";
      }
    }

    setInterval(updateStatusBar, 2500);
    window.addEventListener("load", updateStatusBar);

    recoverBtn.addEventListener("click", async function() {
      recoverBtn.disabled = true;
      recoverBtn.textContent = "Recovering...";
      try {
        const resp = await fetch("/api/v1/robot/safety/recover", { method: "POST" });
        const data = await resp.json();
        if (data.success) {
          safetyBanner.style.display = "none";
        } else {
          const failed = (data.steps || []).filter(s => s.status === "failed").map(s => s.name).join(", ");
          safetyText.textContent = "⚠ Recovery failed: " + (failed || data.message || "unknown");
        }
      } catch (e) {
        safetyText.textContent = "⚠ Recovery error: " + e.message;
      } finally {
        recoverBtn.disabled = false;
        recoverBtn.textContent = "Восстановить";
      }
    });
  </script>
</body>
</html>
