<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
        <title>Arm3D Viewer</title>
        <style>
            html,
            body,
            #viewer {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0f1116;
            }

            .arm3d-status {
                position: fixed;
                left: 12px;
                bottom: 12px;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(0, 0, 0, 0.5);
                color: #d1d5db;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                font-size: 12px;
                line-height: 1;
                z-index: 10;
                user-select: none;
            }

            .arm3d-debug {
                display: none;
                position: fixed;
                right: 12px;
                top: 12px;
                width: 300px;
                padding: 10px 12px;
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.58);
                color: #d1d5db;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                font-size: 12px;
                z-index: 11;
                user-select: none;
            }

            .arm3d-debug-title {
                margin: 0 0 8px 0;
                font-weight: 600;
                color: #e5e7eb;
            }

            .arm3d-debug-subtitle {
                margin: 8px 0 6px 0;
                font-weight: 600;
                color: #cbd5e1;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.02em;
            }

            .arm3d-debug-row {
                display: grid;
                grid-template-columns: 18px 1fr 46px;
                gap: 8px;
                align-items: center;
                margin-bottom: 6px;
            }

            .arm3d-debug-row input[type="range"] {
                width: 100%;
                margin: 0;
            }

            .arm3d-debug-actions {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 8px;
            }

            .arm3d-debug-button {
                border: 1px solid #4b5563;
                background: #111827;
                color: #e5e7eb;
                border-radius: 4px;
                padding: 4px 8px;
                font-size: 12px;
                cursor: pointer;
            }

            .arm3d-debug-button:hover {
                background: #1f2937;
            }

            .arm3d-debug-values {
                color: #9ca3af;
                font-size: 11px;
                text-align: right;
                line-height: 1.35;
            }

            .arm3d-map-controls {
                display: none;
                position: fixed;
                left: 12px;
                top: 12px;
                width: 300px;
                padding: 10px 12px;
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.58);
                color: #d1d5db;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                font-size: 12px;
                z-index: 11;
                user-select: none;
            }

        </style>
    </head>
    <body>
        <div id="viewer"></div>
        <div class="arm3d-map-controls" id="arm3d-map-controls">
            <div class="arm3d-debug-title">AGV Map — Position (m)</div>
            <label class="arm3d-debug-row" for="arm3d-map-plane-px">
                <span>Px</span>
                <input id="arm3d-map-plane-px" type="range" min="-30" max="30" step="0.01" value="0">
                <span id="arm3d-map-plane-px-val">0.00</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-map-plane-py">
                <span>Py</span>
                <input id="arm3d-map-plane-py" type="range" min="-15" max="15" step="0.01" value="0">
                <span id="arm3d-map-plane-py-val">0.00</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-map-plane-pz">
                <span>Pz</span>
                <input id="arm3d-map-plane-pz" type="range" min="-15" max="15" step="0.01" value="0">
                <span id="arm3d-map-plane-pz-val">0.00</span>
            </label>
            <div class="arm3d-debug-title">AGV Map — Rotation (deg)</div>
            <label class="arm3d-debug-row" for="arm3d-map-plane-rx">
                <span>Rx</span>
                <input id="arm3d-map-plane-rx" type="range" min="-180" max="180" step="1" value="0">
                <span id="arm3d-map-plane-rx-val">0°</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-map-plane-ry">
                <span>Ry</span>
                <input id="arm3d-map-plane-ry" type="range" min="-180" max="180" step="1" value="0">
                <span id="arm3d-map-plane-ry-val">0°</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-map-plane-rz">
                <span>Rz</span>
                <input id="arm3d-map-plane-rz" type="range" min="-180" max="180" step="1" value="0">
                <span id="arm3d-map-plane-rz-val">0°</span>
            </label>
            <div class="arm3d-debug-actions">
                <button class="arm3d-debug-button" id="arm3d-map-offset-reset" type="button">Reset</button>
                <span class="arm3d-debug-values" id="arm3d-map-offset-values"></span>
            </div>
        </div>
        <div class="arm3d-debug" id="arm3d-debug-controls">
            <div class="arm3d-debug-title">Debug Model Transform</div>
            <div class="arm3d-debug-subtitle">Rotation (deg)</div>
            <label class="arm3d-debug-row" for="arm3d-debug-rx">
                <span>X</span>
                <input id="arm3d-debug-rx" type="range" min="-180" max="180" step="1" value="0">
                <span id="arm3d-debug-rx-value">0°</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-debug-ry">
                <span>Y</span>
                <input id="arm3d-debug-ry" type="range" min="-180" max="180" step="1" value="0">
                <span id="arm3d-debug-ry-value">0°</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-debug-rz">
                <span>Z</span>
                <input id="arm3d-debug-rz" type="range" min="-180" max="180" step="1" value="0">
                <span id="arm3d-debug-rz-value">0°</span>
            </label>
            <div class="arm3d-debug-subtitle">Position (world units)</div>
            <label class="arm3d-debug-row" for="arm3d-debug-px">
                <span>X</span>
                <input id="arm3d-debug-px" type="range" min="-20" max="20" step="0.1" value="0">
                <span id="arm3d-debug-px-value">0.0</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-debug-py">
                <span>Y</span>
                <input id="arm3d-debug-py" type="range" min="-20" max="20" step="0.1" value="0">
                <span id="arm3d-debug-py-value">0.0</span>
            </label>
            <label class="arm3d-debug-row" for="arm3d-debug-pz">
                <span>Z</span>
                <input id="arm3d-debug-pz" type="range" min="-20" max="20" step="0.1" value="0">
                <span id="arm3d-debug-pz-value">0.0</span>
            </label>
            <div class="arm3d-debug-actions">
                <button class="arm3d-debug-button" id="arm3d-debug-reset" type="button">Reset</button>
                <span class="arm3d-debug-values" id="arm3d-debug-values">R 0/0/0<br>P 0/0/0</span>
            </div>
        </div>
        <div class="arm3d-status" id="arm3d-status">arm3d: init</div>
        <!-- Hybrid scene infrastructure (plain scripts, load before runtime) -->
        <script src="./static/js/scene-config.js?v=20260222c"></script>
        <script src="./static/js/coord-utils.js?v=20260219a"></script>
        <script src="./static/js/scene-helpers.js?v=20260223d"></script>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
                }
            }
        </script>
        <script type="module" src="./static/js/arm3d-runtime.js?v=20260220ad"></script>
    </body>
</html>
