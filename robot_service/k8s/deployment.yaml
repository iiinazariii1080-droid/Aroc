apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-service
  labels:
    app: robot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-service
  template:
    metadata:
      labels:
        app: robot-service
    spec:
      containers:
        - name: robot-service
          image: YOUR_REGISTRY/robot-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8110
          env:
            - name: SERVICE_HOST
              value: "0.0.0.0"
            - name: SERVICE_PORT
              value: "8110"
            - name: LOG_LEVEL
              value: "info"
            - name: APP_CONFIG_FILE
              value: "/app/config/config.yaml"
            - name: XARM_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: robot-service-config
                  key: xarm_ws_url
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8110
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8110
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: app-config
          configMap:
            name: robot-service-config
            items:
              - key: config.yaml
                path: config.yaml


