target-version = "py312"
line-length = 100

[lint]
select = [
    "E9",   # runtime errors
    "F",    # pyflakes (full)
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
]
ignore = [
    "B008",    # function-call-in-default-argument (FastAPI Depends)
    "RUF012",  # mutable-class-default (Pydantic models)
    "UP042",   # str-enum mixin → StrEnum (keep compat with older Python)
    "UP046",   # Generic[T] → type params (keep compat with older Python)
]

[lint.isort]
known-first-party = ["app", "drivers"]

[lint.per-file-ignores]
"drivers/**/*.py" = [
    "SIM102",  # collapsible-if — driver readability
    "SIM105",  # suppressible-exception — intentional bare try/except for robustness
    "SIM108",  # if-else-block-instead-of-if-exp — readability
    "SIM103",  # needless-bool — readability
    "RUF009",  # dataclass-defaults — driver config patterns
    "RUF022",  # unsorted-dunder-all — generated __all__
    "UP038",   # non-pep604-isinstance — driver compat
]
