<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RealSense Viewer</title>
  <script src="/api/v1/color_camera/janus.js"></script>
  <script src="/api/v1/color_camera/gamepaddriver.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webrtc-adapter@8.2.3/out/adapter.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; background:#000; overflow:hidden; }
    video { position:fixed; inset:0; width:100vw; height:100vh; object-fit:fill; transform:rotate(180deg); background:#000; }
	#playBtn {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 10;
  background: rgba(255,255,255,0.9);
  border: 0;
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
  font: 600 12px/1 sans-serif;
}

#statsBtn {
  position: fixed;
  top: 8px;
  left: 90px;
  z-index: 10;
  background: rgba(255,255,255,0.9);
  border: 0;
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
  font: 600 12px/1 sans-serif;
}

#statsBox {
  position: fixed;
  bottom: 8px;
  left: 8px;
  z-index: 20;
  background: rgba(0,0,0,0.7);
  color: #0f0;
  padding: 6px 8px;
  font: 11px/1.4 monospace;
  max-width: 55vw;
  max-height: 40vh;
  overflow: auto;
  white-space: pre;
  pointer-events: none; /* keep the overlay from intercepting clicks */
}

  </style>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <button id="playBtn"  type="button">Play</button>
  <button id="statsBtn" type="button">Show stats</button>
  <pre id="statsBox"></pre>
<video id="video" autoplay playsinline muted></video>

<script>

        (() => {
          "use strict";
		  const DEBUG = window.location.search.includes("debug=1");

		  function dlog(...args) {
			  if (DEBUG) console.log(...args);
		  }

          const HOST = window.location.host;
          const PORT = window.location.port;
          const PROTOCOL = window.location.protocol;
          const WS     = PROTOCOL === "https:" ? "wss" : "ws";
          let _WS = `${WS}://${HOST}`;
          let _REST = `${PROTOCOL}//${HOST}`;
          // Separate base for robot: no color_camera prefix
          const ROBOT_REST = `${PROTOCOL}//${HOST}/api/v1/robot`;
          let JANUS_WS   = `${_WS}/janus-ws`;
          let JANUS_REST = `${_REST}/janus`;

		  if (PORT !== "8900") {
				  _WS = `${_WS}/api/v1/color_camera`;
				  _REST = `${_REST}/api/v1/color_camera`;
				  JANUS_WS   = `${_WS}/janus-ws`;
				  JANUS_REST = `${_REST}/janus`;  // keep it this way: no second /api/v1/color_camera
		  }

          // ---------- UI ----------
		  const $video  = document.getElementById("video");
		  const $play   = document.getElementById("playBtn");
		  const setStatus = (msg) => dlog("[STATUS]", msg);


          if ($video) {
                $video.autoplay = true;
                $video.muted = true;
                $video.playsInline = true;
          }
          if ($play) {
                $play.addEventListener("click", () => {
                      // Plugin is not attached yet
                      if (!streaming) {
                            userWantsPlay = true;
                            $play.disabled = true;
                            $play.textContent = "Connecting…";
                            // initJanus() already runs in DOMContentLoaded,
                            // just wait for attachStreaming to finish the flow
                            return;
                      }

                      // Not watching right now → start playback
                      if (!isWatching) {
                            userWantsPlay = true;
                            $play.disabled = true;
                            $play.textContent = "Connecting…";
                            ensureStreamAndWatch();
                      } else {
                            // Already watching → stop
                            userWantsPlay = false;
                            $play.disabled = true;
                            $play.textContent = "Stopping…";
                            stopStream(() => {
                                  clearVideoTracks();
                                  isWatching = false;
                                  $play.disabled = false;
                                  $play.textContent = "Play";
                            });
                      }
                });
          }


            // ---------- ICE Config ----------
            const DEFAULT_ICE = [
            { urls: ["stun:stun.l.google.com:19302"] },
            ];

            async function loadRtcConfig() {
            try {
            const r = await fetch(`${_REST}/client-config`, { cache: "no-store" });
            if (!r.ok) throw new Error(`client-config HTTP ${r.status}`);

            const cfg = await r.json();

            const iceServers = (cfg.iceServers && cfg.iceServers.length)
                  ? cfg.iceServers
                  : DEFAULT_ICE;

            const iceTransportPolicy =
                  cfg.iceTransportPolicy === "all" || cfg.iceTransportPolicy === "relay"
                  ? cfg.iceTransportPolicy
                  : "all";

            dlog("[client-config]", { iceServers, iceTransportPolicy });

            return { iceServers, iceTransportPolicy };
            } catch (e) {
            console.warn("[client-config] fallback to default ICE:", e);
            return { iceServers: DEFAULT_ICE, iceTransportPolicy: "all" };
            }
            }


          // ---------- State ----------
          const preferStreamId = 1305;
          const streamName     = "RealSense RGB";

          let janus = null, streaming = null, selectedStreamId = null;

          // --- TEXTROOM STATE ---
          let textroom = null;
          const TEXTROOM_ROOM_ID = 1000;
          let textroomReady = false;
          let textroomUsername = "joy-" + Janus.randomString(6);
          const inboundStream = new MediaStream();
          if ($video) $video.srcObject = inboundStream;

          let negotiating = false, offerGen = 0, justHungUpAt = 0;

          const NO_FRAME_THRESHOLD_MS = 30000;
          const WATCHDOG_TICK_MS = 5000;
          const ICE_DISCONNECTED_ESCALATE_MS = 8000;
          // How long a remote track may stay muted before we consider it "stuck"
          const TRACK_MUTE_RESTART_MS = 5000;

          const MAX_WATCH_RETRIES = 3;
          const MAX_REATTACH_RETRIES = 2;
          const RETRY_RESET_WINDOW_MS = 60000;

          // Heuristic: treat all private/IP hosts and localhost as local access.
          const IS_LOCAL_HOST =
                location.hostname === "localhost" ||
                location.hostname === "127.0.0.1" ||
                /^192\.168\./.test(location.hostname) ||
                /^10\./.test(location.hostname) ||
                /^172\.(1[6-9]|2\d|3[0-1])\./.test(location.hostname);

          // For external clients disable aggressive auto-restarts to avoid stop/watch/hangup loops.
          const AUTO_RESTART_ENABLED = IS_LOCAL_HOST;

          let lastFrameTs = 0, watchdogTimer = null, restartInFlight = false;
          let watchRetries = 0, reattachRetries = 0, lastRetryTs = 0, iceDisconnectedSince = 0;

          let isWatching = false;
          let userWantsPlay = false;


          // ---------- Helpers ----------
          function bumpFrameTs(){ lastFrameTs = Date.now(); }
          function resetRetryCounters(){ watchRetries=0; reattachRetries=0; lastRetryTs=Date.now(); }
          function needResetWindow(){ return (Date.now() - lastRetryTs) > RETRY_RESET_WINDOW_MS; }

          function startWatchdog(){
                stopWatchdog();
                watchdogTimer = setInterval(() => {
                  if (!lastFrameTs) return;
                  if (Date.now() - lastFrameTs > NO_FRAME_THRESHOLD_MS) {
                        setStatus("no frames → restart watch…");
                        escalateRestart("no-frames");
                  }
                }, WATCHDOG_TICK_MS);
          }
          function stopWatchdog(){ if (watchdogTimer){ clearInterval(watchdogTimer); watchdogTimer=null; } }

          function addVideoTrack(track){
                const exists = inboundStream.getVideoTracks().some(t => t.id === track.id);
                if (!exists) inboundStream.addTrack(track);
                // attach handlers for every active track
                track.onmute = () => {
                  console.warn("Remote track muted → waiting before deciding to restart");
                  const mutedAt = Date.now();
                  setTimeout(() => {
                        // User may have pressed Stop manually
                        if (!userWantsPlay) return;
                        // If stream unmuted and frames started in that time — do nothing
                        if (!track.muted) return;
                        if (Date.now() - lastFrameTs < TRACK_MUTE_RESTART_MS) return;
                        console.warn("Remote track still muted, escalating restart");
                        escalateRestart("track-muted");
                  }, TRACK_MUTE_RESTART_MS);
                };
                track.onunmute = () => {
                  bumpFrameTs();
                  $video?.play().catch(()=>{});
                  startWatchdog();
                  resetRetryCounters();
                  setStatus("playing…");
                };
          }
          function clearVideoTracks(){ inboundStream.getTracks().forEach(t => inboundStream.removeTrack(t)); }

			function logCandidatesFromSDP(sdp) {
				  const lines = (sdp || "").split("\n").map(l => l.trim()).filter(l => l.startsWith("a=candidate:"));
				  const types = lines.map(l => (l.match(/typ\s+(\w+)/)||[])[1]).filter(Boolean);
				  dlog("[SDP candidates]", types, lines);
				  // Initial SDP often has no srflx/relay candidates; they arrive later via trickle ICE, so no user warning.
				  if (!types.includes("srflx") && !types.includes("relay")) {
					dlog("Initial SDP has no srflx/relay candidates yet; they may arrive later via trickle ICE");
				  }
			}


          // ---------- Janus lifecycle ----------
          function initJanus(){
            setStatus("connecting…");
            Janus.init({
            debug: DEBUG ? "all" : ["warn", "error"],
            callback: async () => {
                  if (!Janus.isWebrtcSupported()) {
                  alert("WebRTC not supported");
                  return;
                  }
                  const rtc = await loadRtcConfig();
                  createSession(rtc);
            }
            });
            }


          function createSession(rtc){
            const servers = [JANUS_WS, JANUS_REST];
            dlog("[Janus.init] servers=", servers, "rtc=", rtc);

            janus = new Janus({
            server: servers,

            iceServers: rtc.iceServers || DEFAULT_ICE,
            iceTransportPolicy: rtc.iceTransportPolicy || "all",

            ipv6: false,
            withCredentials: false,
            destroyOnUnload: true,

            success: () => {
                  // video plugin first
                  attachStreaming();
                  // then text plugin
                  attachTextroom();
            },
            error: (err) => {
                  console.error("Janus init error:", err);
                  scheduleFullRecreate();
            }
            });
            }


          function attachStreaming(){
                janus.attach({
                  plugin: "janus.plugin.streaming",
                  opaqueId: "viewer-" + Janus.randomString(8),

                  success: (handle) => {
                        streaming = handle;
                        setStatus("attached…");
                        if (userWantsPlay) {
                              ensureStreamAndWatch();
                        }
                  },

                  error:   (err) => { console.error("Attach error:", err); scheduleFullRecreate(); },

                  onmessage: (msg, jsep) => {
                        handlePluginEvent(msg);

                        if (msg?.janus === "hangup") {
                          console.warn("Got hangup from Janus:", msg?.reason);
                          negotiating = false; justHungUpAt = Date.now();
                          setTimeout(() => escalateRestart("hangup"), 700);
                          return;
                        }

                        const pdata = msg?.plugindata?.data;
                        const res   = pdata?.result || msg?.result || {};
                        if (res.status === "stopped") {
                          console.warn("Plugin says stopped → re-watch");
                          setTimeout(() => escalateRestart("stopped"), 500);
                          return;
                        }

                        if (jsep && jsep.type === "offer") {
                          if (Date.now() - justHungUpAt < 700) return;
                          if (negotiating) return;
                          negotiating = true;
                          const myGen = ++offerGen;

                          logCandidatesFromSDP(jsep.sdp);

                          streaming.createAnswer({
                                jsep,
                                tracks: [{ type: "video", recv: true }],
                                trickle: true,
                                success: (jsepAnswer) => {
                                  if (myGen !== offerGen) { negotiating = false; return; }
                                  streaming.send({ message: { request: "start" }, jsep: jsepAnswer });
                                  negotiating = false;
                                  setStatus("starting…");
                                },
                                error: (err) => { console.error("CreateAnswer error:", err); negotiating = false; escalateRestart("answer-error"); }
                          });
                        }
                  },

                  onremotetrack: (track, mid, on) => {
                        if (track.kind !== "video") return;
                        if (on) {
                          addVideoTrack(track);
                          $video?.play().catch(()=>{});
                          bumpFrameTs();
                          startWatchdog();
                        }
                  },

                  oncleanup: () => {
                        console.warn("Streaming cleanup");
                        negotiating = false;
                        isWatching = false; // safe to watch again
                        clearVideoTracks();
                  },

                  iceState: (state) => {
                        dlog("ICE state:", state);
                        if (state === "disconnected") {
                          if (!iceDisconnectedSince) iceDisconnectedSince = Date.now();
                          setTimeout(() => {
                                if (iceDisconnectedSince && (Date.now() - iceDisconnectedSince) > ICE_DISCONNECTED_ESCALATE_MS) {
                                  setStatus("ICE disconnected → restart watch…");
                                  escalateRestart("ice-disconnected");
                                }
                          }, ICE_DISCONNECTED_ESCALATE_MS + 100);
                        } else if (state === "connected") {
                          iceDisconnectedSince = 0;
                        } else if (state === "failed") {
                          escalateRestart("ice-failed");
                        }
                  },

                  webrtcState: (isUp) => {
                        dlog("WebRTC PeerConnection is", isUp ? "up" : "down");
                        if (!isUp) setTimeout(() => escalateRestart("pc-down"), 500);
                        else setStatus("connected");
                  }
                });
          }

          // ---------- TextRoom (DataChannel) ----------

          function attachTextroom() {
            if (!janus) return;

            janus.attach({
              plugin: "janus.plugin.textroom",
              opaqueId: "textroom-" + Janus.randomString(8),

              success: (handle) => {
                textroom = handle;
                dlog("[TEXTROOM] attached, id=", textroom.getId());
                // create datachannel
                const body = { request: "setup" };
                textroom.send({ message: body });
              },

              error: (err) => {
                console.error("[TEXTROOM] attach error:", err);
              },

              onmessage: (msg, jsep) => {
                dlog("[TEXTROOM] onmessage:", msg);
                // JSEP for datachannel
                if (jsep) {
                  textroom.createAnswer({
                    jsep,
                    // datachannel only, no audio/video
                    media: { audio: false, video: false, data: true },
                    trickle: true,
                    success: (jsepAnswer) => {
                      const body = { request: "ack" };
                      textroom.send({ message: body, jsep: jsepAnswer });
                    },
                    error: (err) => {
                      console.error("[TEXTROOM] createAnswer error:", err);
                    }
                  });
                }
                // mainly service responses here (joined, left, etc.)
              },

              ondataopen: (data) => {
                dlog("[TEXTROOM] data channel opened");
                textroomReady = true;
                joinTextroomRoom();
                // Gamepad driver already started in Boot; here we only mark channel ready.
              },

              ondata: (data) => {
                try {
                  const json = JSON.parse(data);
                  dlog("[TEXTROOM] ondata:", json);
                  // to receive commands from server — handle here
                } catch(e) {
                  console.warn("[TEXTROOM] bad JSON:", data);
                }
              },

              oncleanup: () => {
                dlog("[TEXTROOM] cleanup");
                textroom = null;
                textroomReady = false;
              }
            });
          }


          function joinTextroomRoom() {
            if (!textroom || !textroomReady) return;

            const join = {
              textroom: "join",
              room: TEXTROOM_ROOM_ID,
              username: textroomUsername,
              display: textroomUsername,
              transaction: Janus.randomString(12)
            };

            textroom.data({
              text: JSON.stringify(join),
              error: (err) => console.error("[TEXTROOM] join error:", err)
            });
          }


          // ---------- Gamepad → joystick (TextRoom + HTTP) ----------

          // flag: enable HTTP frame send (e.g. ?joy_http=1)
          const JOYSTICK_HTTP_ENABLED = window.location.search.includes("joy_http=1");

          function startGamepadDriver(config) {
            if (!window.GamepadDriver) {
              console.warn("[JOYSTICK] GamepadDriver not available");
              return;
            }
            dlog("[JOYSTICK] starting GamepadDriver; HTTP=", JOYSTICK_HTTP_ENABLED, "config=", config || null);
            const axesMap = Array.isArray(config?.axesMap) ? config.axesMap : undefined;
            const buttonsMap = Array.isArray(config?.buttonsMap) ? config.buttonsMap : undefined;
            window.GamepadDriver.start({
              debug: DEBUG,
              // ~30 Hz poll, keepalive every ~150 ms, frame TTL 200 ms
              intervalMs: 30,
              keepaliveMs: 150,
              ttlMs: 200,
              axesMap,
              buttonsMap,
              onFrame: (frame /* JoystickFrame */, gp) => {
                // Do not send anything if user has not pressed Play
                if (!userWantsPlay) return;
                // HTTP transport
                if (JOYSTICK_HTTP_ENABLED) {
                  sendJoystickHttp(frame);
                }
                // TextRoom transport (may be recreated; check each time)
                if (textroom && textroomReady) {
                  sendJoystickPayload(frame);
                }
              }
            });
          }


          function sendJoystickPayload(frame) {
            if (!textroom || !textroomReady) return;

            const envelope = {
              textroom:    "message",
              room:        TEXTROOM_ROOM_ID,
              text:        JSON.stringify(frame),
              transaction: Janus.randomString(12)
            };

            textroom.data({
              text: JSON.stringify(envelope),
              error: (err) => console.error("[TEXTROOM] data send error:", err)
            });
          }


          async function sendJoystickHttp(frame) {
            try {
              const resp = await fetch(`${ROBOT_REST}/joystick/frame`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(frame),
                keepalive: true
              });
              if (!resp.ok) {
                console.warn("[JOYSTICK][HTTP] non-2xx response:", resp.status);
              }
            } catch (e) {
              console.warn("[JOYSTICK][HTTP] request failed:", e);
            }
          }

          // ---------- Plugin events ----------
          function handlePluginEvent(msg) {
                const pdata = msg?.plugindata?.data || {};
                const res = pdata.result || {};

                if (pdata.error_code === 460) { // Already watching mountpoint
                  console.warn("Plugin: Already watching → soft stop→watch");
                  // reset guard state and restart watching gently
                  isWatching = true; // indicate we are indeed in watch state
                  restartWatchSoft();
                  return;
                }

                if (res.status === "idle" || res.status === "stopped") {
                  isWatching = false; // ready to watch again
                  return;
                }
          }

          // ---------- Stream control ----------
          function listStreams(cb){
                if (!streaming) return;
                streaming.send({
                  message: { request: "list" },
                  success: (result) => {
                        const list = result.list || [];
                        dlog("Available streams:", list);

                        const found =
                          list.find(s => s.id === preferStreamId) ||
                          list.find(s => (s.description || "").includes(streamName)) ||
                          list[0];

                        if (!found) {
                              setStatus("no streams available");
                              selectedStreamId = null;
                              if (cb) cb(false);
                              return;
                        }

                        selectedStreamId = found.id;
                        if (cb) cb(true);
                  }
                });
          }


          function watchStream(){
                if (!streaming || !selectedStreamId) return;
                if (isWatching) {
                      console.warn("Already watching, skip");
                      return;
                }
                setStatus(`watching id=${selectedStreamId}`);
                isWatching = true;
                streaming.send({ message: { request: "watch", id: selectedStreamId } });

                if ($play) {
                      $play.disabled = false;
                      $play.textContent = "Stop";
                }
          }
          function ensureStreamAndWatch(){
                if (!streaming) return;

                // Already know which stream to play → watch immediately
                if (selectedStreamId) {
                      watchStream();
                      return;
                }

                // Otherwise query the list, pick a mountpoint, then watch
                listStreams((ok) => {
                      if (!ok) {
                            if ($play) {
                                  $play.disabled = false;
                                  $play.textContent = "Play";
                            }
                            return;
                      }
                      if (userWantsPlay) {
                            watchStream();
                      }
                });
          }


          function stopStream(cb){
                if (!streaming) { cb?.(); return; }
                streaming.send({
                  message: { request: "stop" },
                  success: () => { isWatching = false; cb?.(); }
                });
          }

          function restartWatchSoft(){
                if (!streaming || !selectedStreamId) return;
                if (restartInFlight) return;
                restartInFlight = true;
                stopStream(() => {
                  setTimeout(() => {
                        setStatus("restarting watch…");
                        watchStream();
                        setTimeout(() => { restartInFlight = false; }, 500);
                  }, 500); // short pause to ensure the plugin fully idles
                });
          }

          function detachAndReattach(){
                return new Promise((resolve) => {
                  if (!streaming) return resolve(false);
                  const old = streaming; streaming = null;
                  old.detach({
                        success: () => { attachStreaming(); resolve(true); },
                        error:   () => { attachStreaming(); resolve(true); }
                  });
                });
          }

          function destroyAndRecreateSession(){
                return new Promise((resolve) => {
                  clearVideoTracks();
                  if (!janus) { initJanus(); return resolve(true); }
                  const j = janus; janus = null; streaming = null;
                  j.destroy({
                        success: () => { initJanus(); resolve(true); },
                        error:   () => { initJanus(); resolve(true); }
                  });
                });
          }

          async function escalateRestart(reason){
                if (!AUTO_RESTART_ENABLED) {
                      console.warn("Auto-restart disabled for this host, ignoring reason:", reason);
                      return;
                }
                // Respect manual Stop actions
                if (!userWantsPlay) {
                      console.warn("Skip auto-restart because user stopped playback:", reason);
                      return;
                }

                console.warn("Escalate due to:", reason);
                if (needResetWindow()) resetRetryCounters();

                if (watchRetries < MAX_WATCH_RETRIES) {
                      watchRetries++;
                      lastRetryTs = Date.now();
                      restartWatchSoft();
                      return;
                }
                if (reattachRetries < MAX_REATTACH_RETRIES) {
                      reattachRetries++;
                      lastRetryTs = Date.now();
                      setStatus("re-attaching plugin…");
                      await detachAndReattach();
                      return;
                }

                setStatus("recreating session…");
                resetRetryCounters();
                await destroyAndRecreateSession();
          }

          function scheduleFullRecreate(){ setTimeout(() => destroyAndRecreateSession(), 800); }

          // ---------- WebRTC stats ----------
          const $stats    = document.getElementById("statsBtn");
          const $statsBox = document.getElementById("statsBox");

          let statsTimer      = null;
          let lastVideoBytes  = 0;
          let lastVideoTs     = 0;

          function formatKbps(bytesDelta, msDelta) {
                if (msDelta <= 0 || bytesDelta < 0) return "?";
                const bps = 8 * bytesDelta / (msDelta / 1000); // bits per second
                return (bps / 1000).toFixed(0); // kbit/s
          }

          async function collectStatsOnce() {
                if (!streaming || !streaming.webrtcStuff || !streaming.webrtcStuff.pc) {
                      $statsBox.textContent = "PC not ready yet";
                      return;
                }

                const pc    = streaming.webrtcStuff.pc;
                const stats = await pc.getStats(null);

                let inboundVideo  = null;
                let candidatePair = null;

                stats.forEach(report => {
                      if (report.type === "inbound-rtp" && report.kind === "video" && !report.isRemote) {
                            inboundVideo = report;
                      }
                      if (report.type === "candidate-pair" && report.selected) {
                            candidatePair = report;
                      }
                });

                let text = "";

                if (inboundVideo) {
                      const nowTs   = inboundVideo.timestamp;
                      const nowByte = inboundVideo.bytesReceived;

                      let bitrate = "?";
                      if (lastVideoTs && nowTs > lastVideoTs) {
                            bitrate = formatKbps(nowByte - lastVideoBytes, nowTs - lastVideoTs);
                      }
                      lastVideoTs    = nowTs;
                      lastVideoBytes = nowByte;

                      const lost   = inboundVideo.packetsLost || 0;
                      const recv   = inboundVideo.packetsReceived || 0;
                      const total  = lost + recv;
                      const lossPc = total > 0 ? (100 * lost / total).toFixed(2) : "0.00";

                      const jitterMs = inboundVideo.jitter != null
                            ? (inboundVideo.jitter * 1000).toFixed(1)
                            : "?";

                      const framesDecoded = inboundVideo.framesDecoded ?? "?";
                      const framesDropped = inboundVideo.framesDropped ?? "?";

                      text += `VIDEO inbound-rtp\n`;
                      text += `Bitrate:       ${bitrate} kbit/s\n`;
                      text += `Packets:       recv=${recv}, lost=${lost} (${lossPc}%)\n`;
                      text += `Jitter:        ${jitterMs} ms\n`;
                      text += `Frames:        decoded=${framesDecoded}, dropped=${framesDropped}\n`;
                } else {
                      text += "No inbound-rtp video stats\n";
                }

                if (candidatePair) {
                      const rttMs = candidatePair.currentRoundTripTime != null
                            ? (candidatePair.currentRoundTripTime * 1000).toFixed(0)
                            : "?";
                      const availOut = candidatePair.availableOutgoingBitrate != null
                            ? (candidatePair.availableOutgoingBitrate/1000).toFixed(0)
                            : "?";
                      const availIn = candidatePair.availableIncomingBitrate != null
                            ? (candidatePair.availableIncomingBitrate/1000).toFixed(0)
                            : "?";

                      text += `\nNETWORK (candidate-pair)\n`;
                      text += `RTT:           ${rttMs} ms\n`;
                      text += `Avail bitrate: up=${availOut} / down=${availIn} kbit/s\n`;
                }

                $statsBox.textContent = text;
                dlog("[WEBRTC-STATS]\n" + text.replace(/\n/g, " | "));
          }

          function toggleStats() {
                if (!statsTimer) {
                      // start polling
                      collectStatsOnce();
                      statsTimer = setInterval(collectStatsOnce, 1000);
                      if ($stats) $stats.textContent = "Hide stats";
                } else {
                      // stop polling
                      clearInterval(statsTimer);
                      statsTimer = null;
                      $statsBox.textContent = "";
                      if ($stats) $stats.textContent = "Show stats";
                }
          }

          if ($stats) {
                $stats.addEventListener("click", toggleStats);
          }

          // ---------- Boot ----------
          async function boot() {
                if ($video) {
                  $video.addEventListener("timeupdate", bumpFrameTs);
                  $video.addEventListener("playing",   bumpFrameTs);
                  $video.addEventListener("resize",    bumpFrameTs);
                }

                // Load gamepad mapping config (axes/buttons)
                let gamepadConfig = null;
                try {
                  const resp = await fetch(`${_REST}/gamepad_config.json`, { cache: "no-store" });
                  if (resp.ok) {
                        gamepadConfig = await resp.json();
                        dlog("[JOYSTICK] loaded gamepad_config:", gamepadConfig);
                  } else {
                        console.warn("[JOYSTICK] gamepad_config.json HTTP", resp.status);
                  }
                } catch (e) {
                  console.warn("[JOYSTICK] failed to load gamepad_config.json:", e);
                }

                if (typeof window.GamepadDriver !== "undefined") {
                  try {
                        startGamepadDriver(gamepadConfig);
                  } catch (e) {
                        console.warn("[JOYSTICK] failed to start driver on boot:", e);
                  }
                }

                initJanus();
          }

          document.addEventListener("DOMContentLoaded", () => {
                boot();
          });


        })();
		
        </script>



</body>
