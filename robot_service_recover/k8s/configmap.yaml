apiVersion: v1
kind: ConfigMap
metadata:
  name: robot-service-config
data:
  # Application YAML configuration consumed by app/config.py
  config.yaml: |
    # Base server IP (used as fallback for service IPs below)
    server_ip: 127.0.0.1

    # External services
    igus_container_ip: 127.0.0.1
    igus_container_port: 8101

    xarm_container_ip: 127.0.0.1
    xarm_container_port: 8102

    symovo_container_ip: 127.0.0.1
    symovo_container_port: 7905

    depth_camera_container_ip: 192.168.1.55
    depth_camera_container_port: 8000

    # Joystick defaults (HTTP)
    joystick_deadzone: 0.12
    joystick_default_ttl_ms: 150
    joystick_move_acc: 1000
    joystick_is_move_tool: true
    joystick_mode: 0

  # xArm websocket URL (consumed by services/xarm_websocket_client/config.py via env XARM_WS_URL)
  xarm_ws_url: "ws://127.0.0.1:18333/ws?channel=prod&lang=en&v=1&id=robot"


