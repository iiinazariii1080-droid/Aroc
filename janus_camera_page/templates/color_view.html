<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="style-nonce" content="{{ style_nonce }}">
  <title>RealSense Viewer</title>
  <link rel="stylesheet" href="/api/v1/{{ cam_type }}/static/css/player.css">
  <script src="/api/v1/{{ cam_type }}/player/clean_mode.js"></script>
  <script src="/api/v1/{{ cam_type }}/janus.js"></script>
  <script src="/api/v1/{{ cam_type }}/gamepaddriver.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webrtc-adapter@8.2.3/out/adapter.js"
          integrity="sha384-M+1CvSefTCcyL3Ltxapd+H+xrPcE+qsWuFfm4UmxzWvMnL9OUXKl5Q/23MmynaLq"
          crossorigin="anonymous"></script>
  <!-- Clean-architecture player scripts (no bundler; namespace-based) -->
  <script src="/api/v1/{{ cam_type }}/player/ns.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/config.js?v=2"></script>

  <script src="/api/v1/{{ cam_type }}/player/core/player_state.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/codes.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/domain_events.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/connection_policy.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/state_machine_canonical.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/invariants.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/fail_closed.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/backoff.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/core/recovery_policy.js?v=2"></script>

  <script src="/api/v1/{{ cam_type }}/player/ports/clock_port.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/ports/logger_port.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/ports/streaming_port.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/ports/video_port.js?v=2"></script>

  <script src="/api/v1/{{ cam_type }}/player/adapters/clock.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/adapters/logger.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/adapters/janus_session_manager.js?v=3"></script>
  <script src="/api/v1/{{ cam_type }}/player/adapters/dom_ui_adapter.js?v=5"></script>
  <script src="/api/v1/{{ cam_type }}/player/adapters/janus_streaming_adapter.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/adapters/janus_textroom_adapter.js?v=2"></script>

  <script src="/api/v1/{{ cam_type }}/player/app/stats_service.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/app/joystick_service.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/app/recovery_map.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/app/reconnect_coordinator.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/app/timer_coordinator.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/app/watchdog_service.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/app/player_controller.js?v=2"></script>
  <script src="/api/v1/{{ cam_type }}/player/bootstrap.js?v=2"></script>
  <link rel="icon" href="/favicon.ico">
</head>
<body
  data-style-nonce="{{ style_nonce }}"
  data-prefer-stream-id="{{ stream_id }}"
  data-stream-name="{{ stream_name }}"
  data-api-prefix="/api/v1/{{ cam_type }}"
  data-autoplay="1"
  data-debug-panel="0"
  data-auto-restart="local"
  data-joystick-mode="{{ joystick_mode }}"
  data-no-frame-threshold-ms="5000"
  data-track-mute-ms="3000"
  data-watchdog-interval-ms="2000"
  data-connect-settle-ms="6000"
  data-min-acceptable-fps="5"
  data-fps-drop-threshold-ms="3000"
  data-ice-disconnected-grace-ms="3000"
  data-backoff-base-ms="300"
  data-backoff-min-ms="150"
  data-session-timeout-ms="60000"
  data-client-config-path="/api/v1/{{ cam_type }}/client-config"
>
  <div id="statusPill" role="status" aria-live="polite"></div>
  <pre id="debugPanel" aria-hidden="true"></pre>

  <div class="controls" role="toolbar" aria-label="Player controls">
    <button id="playBtn" type="button" aria-label="Play">Play</button>
    <button id="statsBtn" type="button" aria-label="Toggle statistics">Show stats</button>
  </div>

  <pre id="statsBox" aria-label="Stream statistics"></pre>
  <video id="video" autoplay playsinline muted></video>

{% if depth_features_script %}
<script src="/api/v1/{{ cam_type }}/depth_features.js"></script>
{% endif %}

</body>
</html>
