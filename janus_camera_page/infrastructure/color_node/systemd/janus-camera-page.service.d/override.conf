[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Environment=PYTHONPATH=/home/boris/robot
Environment=ICE_POLICY=relay
EnvironmentFile=-/etc/robot/camera-secrets.env
ExecStart=
ExecStart=/home/boris/robot/.venv/bin/python /home/boris/robot/janus_camera_page/main.py
StateDirectory=camera-fdir
Restart=on-failure
RestartSec=5

# Resource limits
LimitNOFILE=4096
MemoryMax=512M

# Sandboxing
ProtectSystem=strict
ProtectHome=read-only
NoNewPrivileges=yes
ReadWritePaths=/var/lib/camera-fdir
ReadWritePaths=/run/camera
