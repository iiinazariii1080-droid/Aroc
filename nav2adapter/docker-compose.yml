services:
  symovo_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symovo_service
    ports:
      - "7905:7905"
      - "7906:7906"
    env_file:
      - .env
    environment:
      # persist DB + state in /app/data
      - ROBOT_POSITIONS_DB_PATH=/app/data/database.db
      - PERSISTENCE_PATH=/app/data/state.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7905/livez || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
