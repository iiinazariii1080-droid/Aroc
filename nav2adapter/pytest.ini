[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

[tool:pytest]
# Coverage options (use with --cov flag)
# Example: pytest --cov=. --cov-report=html
# Exclusions are handled via .coveragerc or pyproject.toml
