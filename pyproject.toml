[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aroc-robot"
version = "1.0.0"
requires-python = ">=3.12"

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: fast isolated unit tests (no I/O)",
    "integration: tests that exercise multiple modules or HTTP",
    "slow: tests that take > 5 s",
    "hardware: requires real hardware (xArm, dryve, camera, AGV)",
]

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/venv/*",
    "*/htmlcov/*",
    "*/artifacts/*",
    "*/__pycache__/*",
    "*/node_modules/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E9",   # runtime errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
]
ignore = [
    "B008",    # function-call-in-default-argument (FastAPI Depends)
    "RUF012",  # mutable-class-default (Pydantic models)
    "E402",    # module-level import not at top (test setup)
    "SIM108",  # ternary (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "drivers", "services", "routes", "models", "testing_utils"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
pretty = true
show_error_codes = true
