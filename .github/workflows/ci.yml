name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────
  lint:
    name: "Lint (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway_service
          - igus_service
          - mqtt_command_service
          - nav2adapter
          - xarm_service
          - robot_service
          - frontend_service
          - janus_camera_page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.15.0

      - name: Run ruff check
        run: ruff check ${{ matrix.service }}

  # ── Unit tests ─────────────────────────────────────────────────────────
  test:
    name: "Test (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api_gateway_service
            requirements: api_gateway_service/requirements.txt
            cov_source: api_gateway_service/app
          - service: igus_service
            requirements: igus_service/requirements-dev.txt
            cov_source: igus_service/app
          - service: mqtt_command_service
            requirements: mqtt_command_service/requirements.txt
            cov_source: mqtt_command_service
          - service: nav2adapter
            requirements: nav2adapter/requirements.txt
            cov_source: nav2adapter/app
          - service: xarm_service
            requirements: requirements-dev.txt
            cov_source: xarm_service/app
          - service: robot_service
            requirements: robot_service/requirements.txt
            cov_source: robot_service/app
          - service: frontend_service
            requirements: frontend_service/requirements.txt
            cov_source: frontend_service
          - service: janus_camera_page
            requirements: requirements-dev.txt
            cov_source: janus_camera_page/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f "${{ matrix.requirements }}" ]; then
            pip install -r "${{ matrix.requirements }}"
          fi
          # Install service-specific deps if they have their own requirements
          if [ -f "${{ matrix.service }}/requirements.txt" ]; then
            pip install -r "${{ matrix.service }}/requirements.txt"
          fi

      - name: Run tests
        env:
          PYTHONPATH: "${{ matrix.service }}:."
          XARM_IP: "127.0.0.1"
          WS_CHECK_DISABLED: "1"
          DRYVE_HOST: "127.0.0.1"
          MQTT_BROKER: "127.0.0.1"
          DEPTH_BASE_URL: "http://127.0.0.1:9999"
          CONFIG_DB_PATH: ":memory:"
          API_ENABLED: "false"
        run: |
          if [ -d "${{ matrix.service }}/tests" ]; then
            python -m pytest "${{ matrix.service }}/tests" \
              -m "not hardware and not simulator" \
              --timeout=30 \
              -q --tb=short \
              --junitxml=test-results-${{ matrix.service }}.xml \
              --cov="${{ matrix.cov_source }}" \
              --cov-report=term-missing:skip-covered \
              --cov-fail-under=70
          else
            echo "No tests directory found for ${{ matrix.service }}"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: test-results-${{ matrix.service }}.xml
          if-no-files-found: ignore

  # ── Frontend viewer tests (TypeScript/Vitest) ──────────────────────────
  frontend_viewer_test:
    name: "Frontend viewer tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_service/viewer/package-lock.json

      - name: Install viewer dependencies
        working-directory: frontend_service/viewer
        run: npm ci

      - name: Run viewer unit tests
        working-directory: frontend_service/viewer
        run: npm test

  # ── Coverage report (required) ──────────────────────────────────────────
  coverage:
    name: "Coverage report"
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend_viewer_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Install all service requirements
          for svc in api_gateway_service igus_service mqtt_command_service nav2adapter xarm_service robot_service frontend_service janus_camera_page; do
            if [ -f "$svc/requirements-dev.txt" ]; then
              pip install -r "$svc/requirements-dev.txt"
            fi
            if [ -f "$svc/requirements.txt" ]; then
              pip install -r "$svc/requirements.txt"
            fi
          done

      - name: Run tests with coverage
        env:
          XARM_IP: "127.0.0.1"
          WS_CHECK_DISABLED: "1"
          DRYVE_HOST: "127.0.0.1"
          MQTT_BROKER: "127.0.0.1"
          DEPTH_BASE_URL: "http://127.0.0.1:9999"
          CONFIG_DB_PATH: ":memory:"
          API_ENABLED: "false"
        run: |
          for svc in api_gateway_service igus_service mqtt_command_service nav2adapter xarm_service robot_service frontend_service janus_camera_page; do
            if [ -d "$svc/tests" ]; then
              echo "── coverage: $svc ──"
              if [ "$svc" = "frontend_service" ] || [ "$svc" = "mqtt_command_service" ]; then
                cov_source="$svc"
              else
                cov_source="$svc/app"
              fi
              PYTHONPATH="$svc:.:$PYTHONPATH" \
              python -m pytest "$svc/tests" \
                -m "not hardware and not simulator" \
                --cov="$cov_source" \
                --cov-report=term-missing:skip-covered \
                --timeout=30 -q --tb=short
              echo ""
            fi
          done
