<script>
// client.js
let pc = null;
let dataChannel = null;
let depthLabel = null;
let depthTimeout = null;
let overlayConnected = false; // DataChannel open to overlay backend
let remoteVideoActive = false; // Janus remote video track received and active
let overlayStatsInterval = null; // periodic getStats logging for overlay PC
let overlayConnectGuard = null; // fallback timer if no candidate pair selected
let overlayConnectAttempt = 0; // attempt counter for overlay
let overlayOfferSeq = 0; // negotiation sequence guard

// Функция для определения базового URL
// function getBaseUrl() {
//   // Проверяем, работаем ли мы через прокси
//   if (window.location.pathname.startsWith('/api/v1/depth_camera')) {
//     return '/api/v1/depth_camera';
//   }
//   return '';
// }

document.addEventListener('DOMContentLoaded', () => {
  depthLabel = document.getElementById('depth-label');
});

/**
 * Initialize WebRTC connection and start overlay.
 */
async function setOverlay(colorIndex = 0, stereoIndex = 0, options = {}) {
  cleanup();

  overlayConnectAttempt = (options.attempt || 1);
  const mySeq = (++overlayOfferSeq);

  // Build ICE servers with UDP and TCP TURN; enforce relay-only for internet
  const turnHost = '82.165.177.194';
  const turnUser = 'webrtc';
  const turnPass = 'G456AH37gbc';
  let iceServers;
  let iceTransportPolicy = 'relay';
  // TURN only (no public STUN) to avoid leaking unroutable candidates
  if (overlayConnectAttempt === 1) {
    iceServers = [
      { urls: `turn:${turnHost}:3478?transport=udp`, username: turnUser, credential: turnPass },
      { urls: `turns:${turnHost}:5349?transport=tcp`, username: turnUser, credential: turnPass },
    ];
  } else if (overlayConnectAttempt === 2) {
    // Relay-only, UDP TURN only
    iceServers = [
      { urls: `turn:${turnHost}:3478?transport=udp`, username: turnUser, credential: turnPass },
    ];
  } else {
    // Relay-only, TCP TURN only
    iceServers = [
      { urls: `turns:${turnHost}:5349?transport=tcp`, username: turnUser, credential: turnPass },
    ];
  }

  pc = new RTCPeerConnection({
    sdpSemantics: 'unified-plan',
    iceServers: iceServers,
    iceTransportPolicy: iceTransportPolicy
  });
  console.log('[OVERLAY] RTCPeerConnection created', { attempt: overlayConnectAttempt, iceTransportPolicy });
  try {
    pc.addEventListener('icegatheringstatechange', () => console.log('[OVERLAY][pc] iceGatheringState =', pc.iceGatheringState));
    pc.addEventListener('iceconnectionstatechange', () => console.log('[OVERLAY][pc] iceConnectionState =', pc.iceConnectionState));
    pc.addEventListener('signalingstatechange', () => console.log('[OVERLAY][pc] signalingState =', pc.signalingState));
    pc.addEventListener('connectionstatechange', () => console.log('[OVERLAY][pc] connectionState =', pc.connectionState));
    pc.addEventListener('negotiationneeded', () => console.log('[OVERLAY][pc] negotiationneeded'));
    pc.addEventListener('icecandidateerror', (e) => {
      try {
        console.error('[OVERLAY][pc] icecandidateerror', { errorCode: e.errorCode, errorText: e.errorText, url: e.url, hostCandidate: e.hostCandidate, status: e.status });
      } catch (err) { console.error('[OVERLAY][pc] icecandidateerror', e); }
    });
    pc.onicecandidate = (e) => {
      const cand = e && e.candidate ? e.candidate.candidate : null;
      if (!cand) { console.log('[OVERLAY][pc] onicecandidate: null'); return; }
      // Try to extract candidate details
      let details = { raw: cand };
      try {
        // typical format: candidate:foundation component protocol priority ip port typ type ...
        const parts = cand.split(' ');
        details.protocol = parts[2];
        details.ip = parts[4];
        details.port = parts[5];
        const typIdx = parts.indexOf('typ');
        if (typIdx >= 0 && parts[typIdx+1]) details.type = parts[typIdx+1];
      } catch (_) {}
      console.log('[OVERLAY][pc] onicecandidate:', details);
    };
  } catch (e) {
    console.warn('[OVERLAY] Failed to attach PC diagnostics', e);
  }

  // Get tracks
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  // Get media
  pc.addEventListener('track', (evt) => {
    const stream = evt.streams[0];
    if (evt.track.kind === 'video') {
      console.log('[OVERLAY][pc] remote video track:', {
        id: evt.track && evt.track.id,
        muted: evt.track && evt.track.muted,
        enabled: evt.track && evt.track.enabled
      });
      document.getElementById('video').srcObject = stream;
      try {
        const video = document.getElementById('video');
        console.log('[OVERLAY][video] set srcObject ->', stream && stream.id, 'tracks:', stream && stream.getTracks().map(t => ({ kind: t.kind, id: t.id, muted: t.muted, enabled: t.enabled })));
        video.play().then(() => console.log('[OVERLAY][video] play() resolved')).catch(err => console.warn('[OVERLAY][video] play() rejected', err));
      } catch (e) { console.warn('[OVERLAY][video] play error', e); }
    } else if (evt.track.kind === 'audio') {
      console.log('[OVERLAY][pc] remote audio track:', {
        id: evt.track && evt.track.id,
        muted: evt.track && evt.track.muted,
        enabled: evt.track && evt.track.enabled
      });
      document.getElementById('audio').srcObject = stream;
    }
  });

  // DataChannel
  dataChannel = pc.createDataChannel('control', { ordered: true });

  dataChannel.addEventListener('open', () => {
    console.log('DataChannel opened');
    overlayConnected = true;
  });

  dataChannel.addEventListener('close', () => {
    console.log('[OVERLAY][dc] close');
  });

  dataChannel.addEventListener('error', (e) => {
    console.error('[OVERLAY][dc] error', e);
  });

  dataChannel.addEventListener('message', handleDataMessage);

  try {
    // const baseUrl = getBaseUrl();
    // await negotiate(`${baseUrl}/overlay_offer`, 'overlay', colorIndex, stereoIndex, mySeq);
	await negotiate(`${DEPTH_API_BASE}/overlay_offer`, 'overlay', colorIndex, stereoIndex, mySeq);

    try {
      if (overlayStatsInterval) clearInterval(overlayStatsInterval);
      overlayStatsInterval = setInterval(async () => {
        try {
          if (!pc) return;
          const stats = await pc.getStats();
          let inboundVideo = null;
          let selectedPair = null;
          let localCand = null;
          let remoteCand = null;
          stats.forEach(r => {
            if (r.type === 'inbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) inboundVideo = r;
            if (r.type === 'candidate-pair' && (r.selected || r.state === 'succeeded')) selectedPair = r;
            if (r.type === 'transport' && r.selectedCandidatePairId) {
              // Chrome sometimes exposes via transport
              stats.forEach(rr => { if (rr.id === r.selectedCandidatePairId) selectedPair = rr; });
            }
          });
          if (selectedPair && (!selectedPair.nominated && !selectedPair.selected)) {
            // Normalize
            selectedPair.selected = true;
          }
          if (selectedPair) {
            stats.forEach(r => { if (r.id === selectedPair.localCandidateId) localCand = r; if (r.id === selectedPair.remoteCandidateId) remoteCand = r; });
          }
          console.log('[OVERLAY][STATS]', inboundVideo ? {
            bytesReceived: inboundVideo.bytesReceived,
            packetsReceived: inboundVideo.packetsReceived,
            framesDecoded: inboundVideo.framesDecoded,
            framesDropped: inboundVideo.framesDropped,
            jitter: inboundVideo.jitter,
            packetsLost: inboundVideo.packetsLost
          } : 'no inbound video stats', selectedPair ? {
            selectedPair: {
              state: selectedPair.state,
              currentRtt: selectedPair.currentRoundTripTime,
              bytesReceived: selectedPair.bytesReceived,
              bytesSent: selectedPair.bytesSent
            },
            local: localCand ? { type: localCand.candidateType, ip: localCand.ip, port: localCand.port, protocol: localCand.protocol } : null,
            remote: remoteCand ? { type: remoteCand.candidateType, ip: remoteCand.ip, port: remoteCand.port, protocol: remoteCand.protocol } : null
          } : 'no selected candidate pair');
        } catch (_) {}
      }, 2000);
    } catch (e) { console.warn('[OVERLAY] failed to start stats interval', e); }

    // Fallback guard: if after 9s we still have no selected pair and not connected, retry with staged relay-only
    if (overlayConnectGuard) clearTimeout(overlayConnectGuard);
    overlayConnectGuard = setTimeout(async () => {
      try {
        if (!pc) return;
        const st = pc.iceConnectionState;
        if (st === 'connected' || st === 'completed') return;
        let hasSelected = false;
        try {
          const stats = await pc.getStats();
          stats.forEach(r => { if (r.type === 'candidate-pair' && (r.selected || r.state === 'succeeded')) hasSelected = true; });
        } catch (_) {}
        if (!hasSelected) {
          if (overlayConnectAttempt === 1) {
            console.warn('[OVERLAY] No selected candidate pair, retrying with TURN relay-only (UDP)');
            cleanup();
            setOverlay(colorIndex, stereoIndex, { attempt: 2, forceRelay: true });
          } else if (overlayConnectAttempt === 2) {
            console.warn('[OVERLAY] Still no selected pair on UDP relay, retrying with TURN relay-only (TCP)');
            cleanup();
            setOverlay(colorIndex, stereoIndex, { attempt: 3, forceRelay: true });
          } else {
            console.error('[OVERLAY] All ICE attempts failed');
          }
        }
      } catch (e) { console.warn('[OVERLAY] connect guard error', e); }
    }, 9000);
  } catch (err) {
    console.error('Negotiation failed:', err);
    alert('Connection error: ' + err.message);
  }
}

/**
 * Send pixel coordinates via DataChannel.
 */
function sendPixelPercent(xPercent, yPercent) {
  if (dataChannel && dataChannel.readyState === 'open') {
    const msg = { type: 'pixel', x: xPercent, y: yPercent };
    dataChannel.send(JSON.stringify(msg));
  } else {
    console.warn('DataChannel is not open');
  }
}

/**
 * Handle incoming DataChannel messages.
 */
function handleDataMessage(event) {
  try {
    const msg = JSON.parse(event.data);
    if (msg.type === 'depth') {
      const text = msg.depth > 0
        ? `${(msg.depth / 1000).toFixed(2)}m`
        : '--';

      if (depthLabel) {
        depthLabel.innerText = text;
        depthLabel.classList.add('show');
        clearTimeout(depthTimeout);
        // Keep depth visible until new measurement
      }
    }
  } catch (err) {
    console.warn('Invalid message:', event.data);
  }
}

/**
 * Signaling: send SDP offer and get answer.
 */
async function negotiate(url, mode, colorIndex, stereoIndex, seqGuard) {
  console.log('[OVERLAY][negotiate] starting', { url, mode, colorIndex, stereoIndex });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  console.log('[OVERLAY][negotiate] created local offer, sdp length=', (offer && offer.sdp && offer.sdp.length));

  await waitForIceGathering();

  const body = {
    sdp: pc.localDescription.sdp,
    type: pc.localDescription.type,
    color_index: colorIndex,
    stereo_index: stereoIndex,
    mode: mode
  };

  console.log('[OVERLAY][negotiate] POST', url, body);
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    throw new Error(`Server error: ${response.status}`);
  }

  const answer = await response.json();
  const sdpLen = answer && answer.sdp ? answer.sdp.length : 0;
  const candCount = answer && answer.sdp ? (answer.sdp.match(/^a=candidate:/gm) || []).length : 0;
  const hasIceLite = answer && answer.sdp ? /a=ice-lite/m.test(answer.sdp) : false;
  console.log('[OVERLAY][negotiate] got answer, type=', answer && answer.type, 'sdp length=', sdpLen, 'candidates=', candCount, 'ice-lite=', hasIceLite);
  if (candCount === 0) {
    console.warn('[OVERLAY][negotiate] WARNING: remote SDP has no a=candidate lines. Internet path will fail without remote ICE candidates.');
  }
  // Negotiation guard: ignore late answers if a newer attempt started
  if (seqGuard && seqGuard !== overlayOfferSeq) {
    console.warn('[OVERLAY][negotiate] stale answer ignored (seq mismatch)', { seqGuard, overlayOfferSeq });
    return;
  }
  await pc.setRemoteDescription(answer);
  console.log('[OVERLAY][negotiate] setRemoteDescription complete');
}

/**
 * Wait for ICE gathering to complete.
 */
function waitForIceGathering() {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') {
      console.log('[OVERLAY][pc] ICE already complete');
      resolve();
    } else {
      const checkState = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', checkState);
          console.log('[OVERLAY][pc] ICE gathering completed');
          resolve();
        }
      };
      pc.addEventListener('icegatheringstatechange', checkState);
    }
  });
}

/**
 * Clean up resources and close connection.
 */
function cleanup() {
  console.log('[OVERLAY] cleanup invoked');
  if (depthTimeout) {
    clearTimeout(depthTimeout);
    depthTimeout = null;
  }
  if (overlayStatsInterval) {
    clearInterval(overlayStatsInterval);
    overlayStatsInterval = null;
  }
  if (overlayConnectGuard) {
    clearTimeout(overlayConnectGuard);
    overlayConnectGuard = null;
  }

  if (pc) {
    pc.getSenders().forEach((sender) => {
      if (sender.track) sender.track.stop();
    });
    pc.close();
    pc = null;
  }

  dataChannel = null;
  overlayConnected = false;

  if (depthLabel) {
    depthLabel.classList.remove('show');
    depthLabel.innerText = '';
  }
}

<script>
	// === Проксируемые endpoints (proxy-aware) ===
	// Вычисляем базовый путь с учетом прокси-префикса, например /api/v1/depth_camera
	(function() {
		const path = location.pathname.replace(/\/+$/, ''); // без завершающего слэша
		const marker = '/depth_camera';
		const idx = path.indexOf(marker);
		let depthPath = marker; // значение по умолчанию
		let prefix = '';
		if (idx >= 0) {
			prefix = path.slice(0, idx);                  // например "/api/v1"
			depthPath = path.slice(0, idx + marker.length); // например "/api/v1/depth_camera"
		}
		window.DEPTH_API_BASE = `${location.origin}${depthPath}`;
		window.JANUS_SERVER   = `${location.origin}${prefix}/janus`;
	})();

		if(typeof gatewayCallbacks.longPollTimeout !== 'undefined' && gatewayCallbacks.longPollTimeout !== null)
			longPollTimeout = gatewayCallbacks.longPollTimeout;
		if(isNaN(longPollTimeout))
			longPollTimeout = 60000;

		// overrides for default maxBitrate values for simulcasting
		function getMaxBitrates(simulcastMaxBitrates) {
			let maxBitrates = {
				high: 900000,
				medium: 300000,
				low: 100000,
			};

			if(typeof simulcastMaxBitrates !== 'undefined' && simulcastMaxBitrates !== null) {
				if(simulcastMaxBitrates.high)
					maxBitrates.high = simulcastMaxBitrates.high;
				if(simulcastMaxBitrates.medium)
					maxBitrates.medium = simulcastMaxBitrates.medium;
				if(simulcastMaxBitrates.low)
					maxBitrates.low = simulcastMaxBitrates.low;
			}

			return maxBitrates;
		}

		let connected = false;
		let sessionId = null;
		let pluginHandles = new Map();
		let that = this;
		let retries = 0;
		let transactions = new Map();
		createSession(gatewayCallbacks);

		// Public methods
		this.getServer = function() { return server; };
		this.isConnected = function() { return connected; };
		this.reconnect = function(callbacks) {
			callbacks = callbacks || {};
			callbacks.success = (typeof callbacks.success == "function") ? callbacks.success : Janus.noop;
			callbacks.error = (typeof callbacks.error == "function") ? callbacks.error : Janus.noop;
			callbacks["reconnect"] = true;
			createSession(callbacks);
		};
		this.getSessionId = function() { return sessionId; };
		this.getInfo = function(callbacks) { getInfo(callbacks); };
		this.destroy = function(callbacks) { destroySession(callbacks); };
		this.attach = function(callbacks) { createHandle(callbacks); };

		function eventHandler() {
			if(sessionId == null)
				return;
			Janus.debug('Long poll...');
			if(!connected) {
				Janus.warn("Is the server down? (connected=false)");
				return;
			}
			let longpoll = server + "/" + sessionId + "?rid=" + new Date().getTime();
			if(maxev)
				longpoll = longpoll + "&maxev=" + maxev;
			if(token)
				longpoll = longpoll + "&token=" + encodeURIComponent(token);
			if(apisecret)
				longpoll = longpoll + "&apisecret=" + encodeURIComponent(apisecret);
			Janus.httpAPICall(longpoll, {
				verb: 'GET',
				withCredentials: withCredentials,
				success: handleEvent,
				timeout: longPollTimeout,
				error: function(textStatus, errorThrown) {
					Janus.error(textStatus + ":", errorThrown);
					retries++;
					if(retries > 3) {
						// Did we just lose the server? :-(
						connected = false;
						gatewayCallbacks.error("Lost connection to the server (is it down?)");
						return;
					}
					eventHandler();
				}
			});
		}

		// Private event handler: this will trigger plugin callbacks, if set
		function handleEvent(json, skipTimeout) {
			retries = 0;
			if(!websockets && typeof sessionId !== 'undefined' && sessionId !== null && skipTimeout !== true)
				eventHandler();
			if(!websockets && Janus.isArray(json)) {
				// We got an array: it means we passed a maxev > 1, iterate on all objects
				for(let i=0; i<json.length; i++) {
					handleEvent(json[i], true);
				}
				return;
			}
			if(json["janus"] === "keepalive") {
				// Nothing happened
				Janus.vdebug("Got a keepalive on session " + sessionId);
				return;
			} else if(json["janus"] === "server_info") {
				// Just info on the Janus instance
				Janus.debug("Got info on the Janus instance");
				Janus.debug(json);
				const transaction = json["transaction"];
				if(transaction) {
					const reportSuccess = transactions.get(transaction);
					if(reportSuccess)
						reportSuccess(json);
					transactions.delete(transaction);
				}
				return;
			} else if(json["janus"] === "ack") {
				// Just an ack, we can probably ignore
				Janus.debug("Got an ack on session " + sessionId);
				Janus.debug(json);
				const transaction = json["transaction"];
				if(transaction) {
					const reportSuccess = transactions.get(transaction);
					if(reportSuccess)
						reportSuccess(json);
					transactions.delete(transaction);
				}
				return;
			} else if(json["janus"] === "success") {
				// Success!
				Janus.debug("Got a success on session " + sessionId);
				Janus.debug(json);
				const transaction = json["transaction"];
				if(transaction) {
					const reportSuccess = transactions.get(transaction);
					if(reportSuccess)
						reportSuccess(json);
					transactions.delete(transaction);
				}
				return;
			} else if(json["janus"] === "trickle") {
				// We got a trickle candidate from Janus
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					Janus.debug("This handle is not attached to this session");
					return;
				}
				let candidate = json["candidate"];
				Janus.debug("Got a trickled candidate on session " + sessionId);
				Janus.debug(candidate);
				let config = pluginHandle.webrtcStuff;
				if(config.pc && config.remoteSdp) {
					// Add candidate right now
					Janus.debug("Adding remote candidate:", candidate);
					if(!candidate || candidate.completed === true) {
						// end-of-candidates
						config.pc.addIceCandidate(Janus.endOfCandidates);
					} else {
						// New candidate
						config.pc.addIceCandidate(candidate);
					}
				} else {
					// We didn't do setRemoteDescription (trickle got here before the offer?)
					Janus.debug("We didn't do setRemoteDescription (trickle got here before the offer?), caching candidate");
					if(!config.candidates)
						config.candidates = [];
					config.candidates.push(candidate);
					Janus.debug(config.candidates);
				}
			} else if(json["janus"] === "webrtcup") {
				// The PeerConnection with the server is up! Notify this
				Janus.debug("Got a webrtcup event on session " + sessionId);
				Janus.debug(json);
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					Janus.debug("This handle is not attached to this session");
					return;
				}
				pluginHandle.webrtcState(true);
				return;
			} else if(json["janus"] === "hangup") {
				// A plugin asked the core to hangup a PeerConnection on one of our handles
				Janus.debug("Got a hangup event on session " + sessionId);
				Janus.debug(json);
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					Janus.debug("This handle is not attached to this session");
					return;
				}
				pluginHandle.webrtcState(false, json["reason"]);
				pluginHandle.hangup();
			} else if(json["janus"] === "detached") {
				// A plugin asked the core to detach one of our handles
				Janus.debug("Got a detached event on session " + sessionId);
				Janus.debug(json);
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					// Don't warn here because destroyHandle causes this situation.
					return;
				}
				pluginHandle.ondetached();
				pluginHandle.detach();
			} else if(json["janus"] === "media") {
				// Media started/stopped flowing
				Janus.debug("Got a media event on session " + sessionId);
				Janus.debug(json);
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					Janus.debug("This handle is not attached to this session");
					return;
				}
				pluginHandle.mediaState(json["type"], json["receiving"], json["mid"]);
			} else if(json["janus"] === "slowlink") {
				Janus.debug("Got a slowlink event on session " + sessionId);
				Janus.debug(json);
				// Trouble uplink or downlink
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					Janus.debug("This handle is not attached to this session");
					return;
				}
				pluginHandle.slowLink(json["uplink"], json["lost"], json["mid"]);
			} else if(json["janus"] === "error") {
				// Oops, something wrong happened
				Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
				Janus.debug(json);
				let transaction = json["transaction"];
				if(transaction) {
					let reportSuccess = transactions.get(transaction);
					if(reportSuccess) {
						reportSuccess(json);
					}
					transactions.delete(transaction);
				}
				return;
			} else if(json["janus"] === "event") {
				Janus.debug("Got a plugin event on session " + sessionId);
				Janus.debug(json);
				const sender = json["sender"];
				if(!sender) {
					Janus.warn("Missing sender...");
					return;
				}
				let plugindata = json["plugindata"];
				if(!plugindata) {
					Janus.warn("Missing plugindata...");
					return;
				}
				Janus.debug("  -- Event is coming from " + sender + " (" + plugindata["plugin"] + ")");
				let data = plugindata["data"];
				Janus.debug(data);
				const pluginHandle = pluginHandles.get(sender);
				if(!pluginHandle) {
					Janus.warn("This handle is not attached to this session");
					return;
				}
				let jsep = json["jsep"];
				if(jsep) {
					Janus.debug("Handling SDP as well...");
					Janus.debug(jsep);
				}
				let callback = pluginHandle.onmessage;
				if(callback) {
					Janus.debug("Notifying application...");
					// Send to callback specified when attaching plugin handle
					callback(data, jsep);
				} else {
					// Send to generic callback (?)
					Janus.debug("No provided notification callback");
				}
			} else if(json["janus"] === "timeout") {
				Janus.error("Timeout on session " + sessionId);
				Janus.debug(json);
				if(websockets) {
					ws.close(3504, "Gateway timeout");
				}
				return;
			} else {
				Janus.warn("Unknown message/event  '" + json["janus"] + "' on session " + sessionId);
				Janus.debug(json);
			}
		}

		// Private helper to send keep-alive messages on WebSockets
		function keepAlive() {
			if(!server || !websockets || !connected)
				return;
			wsKeepaliveTimeoutId = setTimeout(keepAlive, keepAlivePeriod);
			let request = { "janus": "keepalive", "session_id": sessionId, "transaction": Janus.randomString(12) };
			if(token)
				request["token"] = token;
			if(apisecret)
				request["apisecret"] = apisecret;
			ws.send(JSON.stringify(request));
		}

		// Private method to create a session
		function createSession(callbacks) {
			let transaction = Janus.randomString(12);
			let request = { "janus": "create", "transaction": transaction };
			if(callbacks["reconnect"]) {
				// We're reconnecting, claim the session
				connected = false;
				request["janus"] = "claim";
				request["session_id"] = sessionId;
				// If we were using websockets, ignore the old connection
				if(ws) {
					ws.onopen = null;
					ws.onerror = null;
					ws.onclose = null;
					if(wsKeepaliveTimeoutId) {
						clearTimeout(wsKeepaliveTimeoutId);
						wsKeepaliveTimeoutId = null;
					}
				}
			}
			if(token)
				request["token"] = token;
			if(apisecret)
				request["apisecret"] = apisecret;
			if(!server && Janus.isArray(servers)) {
				// We still need to find a working server from the list we were given
				server = servers[serversIndex];
				if(server.indexOf("ws") === 0) {
					websockets = true;
					Janus.log("Server #" + (serversIndex+1) + ": trying WebSockets to contact Janus (" + server + ")");
				} else {
					websockets = false;
					Janus.log("Server #" + (serversIndex+1) + ": trying REST API to contact Janus (" + server + ")");
				}
			}
			if(websockets) {
				ws = Janus.newWebSocket(server, 'janus-protocol');
				wsHandlers = {
					'error': function() {
						Janus.error("Error connecting to the Janus WebSockets server... " + server);
						if(Janus.isArray(servers) && !callbacks["reconnect"]) {
							serversIndex++;
							if(serversIndex === servers.length) {
								// We tried all the servers the user gave us and they all failed
								callbacks.error("Error connecting to any of the provided Janus servers: Is the server down?");
								return;
							}
							// Let's try the next server
							server = null;
							setTimeout(function() {
								createSession(callbacks);
							}, 200);
							return;
						}
						callbacks.error("Error connecting to the Janus WebSockets server: Is the server down?");
					},

					'open': function() {
						// We need to be notified about the success
						transactions.set(transaction, function(json) {
							Janus.debug(json);
							if(json["janus"] !== "success") {
								Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
								callbacks.error(json["error"].reason);
								return;
							}
							wsKeepaliveTimeoutId = setTimeout(keepAlive, keepAlivePeriod);
							connected = true;
							sessionId = json["session_id"] ? json["session_id"] : json.data["id"];
							if(callbacks["reconnect"]) {
								Janus.log("Claimed session: " + sessionId);
							} else {
								Janus.log("Created session: " + sessionId);
							}
							Janus.sessions.set(sessionId, that);
							callbacks.success();
						});
						ws.send(JSON.stringify(request));
					},

					'message': function(event) {
						handleEvent(JSON.parse(event.data));
					},

					'close': function() {
						if(!server || !connected) {
							return;
						}
						connected = false;
						// FIXME What if this is called when the page is closed?
						gatewayCallbacks.error("Lost connection to the server (is it down?)");
					}
				};

				for(let eventName in wsHandlers) {
					ws.addEventListener(eventName, wsHandlers[eventName]);
				}

				return;
			}
			Janus.httpAPICall(server, {
				verb: 'POST',
				withCredentials: withCredentials,
				body: request,
				success: function(json) {
					Janus.debug(json);
					if(json["janus"] !== "success") {
						Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
						callbacks.error(json["error"].reason);
						return;
					}
					connected = true;
					sessionId = json["session_id"] ? json["session_id"] : json.data["id"];
					if(callbacks["reconnect"]) {
						Janus.log("Claimed session: " + sessionId);
					} else {
						Janus.log("Created session: " + sessionId);
					}
					Janus.sessions.set(sessionId, that);
					eventHandler();
					callbacks.success();
				},
				error: function(textStatus, errorThrown) {
					Janus.error(textStatus + ":", errorThrown);	// FIXME
					if(Janus.isArray(servers) && !callbacks["reconnect"]) {
						serversIndex++;
						if(serversIndex === servers.length) {
							// We tried all the servers the user gave us and they all failed
							callbacks.error("Error connecting to any of the provided Janus servers: Is the server down?");
							return;
						}
						// Let's try the next server
						server = null;
						setTimeout(function() { createSession(callbacks); }, 200);
						return;
					}
					if(errorThrown === "")
						callbacks.error(textStatus + ": Is the server down?");
					else if(errorThrown && errorThrown.error)
						callbacks.error(textStatus + ": " + errorThrown.error.message);
					else
						callbacks.error(textStatus + ": " + errorThrown);
				}
			});
		}

		// Private method to get info on the server
		function getInfo(callbacks) {
			callbacks = callbacks || {};
			// FIXME This method triggers a success even when we fail
			callbacks.success = (typeof callbacks.success == "function") ? callbacks.success : Janus.noop;
			callbacks.error = (typeof callbacks.error == "function") ? callbacks.error : Janus.noop;
			Janus.log("Getting info on Janus instance");
			if(!connected) {
				Janus.warn("Is the server down? (connected=false)");
				callbacks.error("Is the server down? (connected=false)");
				return;
			}
			// We just need to send an "info" request
			let transaction = Janus.randomString(12);
			let request = { "janus": "info", "transaction": transaction };
			if(token)
				request["token"] = token;
			if(apisecret)
				request["apisecret"] = apisecret;
			if(websockets) {
				transactions.set(transaction, function(json) {
					Janus.log("Server info:");
					Janus.debug(json);
					if(json["janus"] !== "server_info") {
						Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
					}
					callbacks.success(json);
				});
				ws.send(JSON.stringify(request));
				return;
			}
			Janus.httpAPICall(server, {
				verb: 'POST',
				withCredentials: withCredentials,
				body: request,
				success: function(json) {
					Janus.log("Server info:");
					Janus.debug(json);
					if(json["janus"] !== "server_info") {
						Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
					}
					callbacks.success(json);
				},
				error: function(textStatus, errorThrown) {
					Janus.error(textStatus + ":", errorThrown);	// FIXME
					if(errorThrown === "")
						callbacks.error(textStatus + ": Is the server down?");
					else
						callbacks.error(textStatus + ": " + errorThrown);
				}
			});
		}

		// Private method to destroy a session
		function destroySession(callbacks) {
			callbacks = callbacks || {};
			// FIXME This method triggers a success even when we fail
			callbacks.success = (typeof callbacks.success == "function") ? callbacks.success : Janus.noop;
			callbacks.error = (typeof callbacks.error == "function") ? callbacks.error : Janus.noop;
			let unload = (callbacks.unload === true);
			let notifyDestroyed = true;
			if(typeof callbacks.notifyDestroyed !== 'undefined' && callbacks.notifyDestroyed !== null)
				notifyDestroyed = (callbacks.notifyDestroyed === true);
			let cleanupHandles = (callbacks.cleanupHandles === true);
			Janus.log("Destroying session " + sessionId + " (unload=" + unload + ")");
			if(!sessionId) {
				Janus.warn("No session to destroy");
				callbacks.success();
				if(notifyDestroyed)
					gatewayCallbacks.destroyed();
				return;
			}
			if(cleanupHandles) {
				for(const handleId of pluginHandles.keys())
					destroyHandle(handleId, { noRequest: true });
			}
			if(!connected) {
				Janus.warn("Is the server down? (connected=false)");
				sessionId = null;
				callbacks.success();
				return;
			}
			// No need to destroy all handles first, Janus will do that itself
			let request = { "janus": "destroy", "transaction": Janus.randomString(12) };
			if(token)
				request["token"] = token;
			if(apisecret)
				request["apisecret"] = apisecret;
			if(unload) {
				// We're unloading the page: use sendBeacon for HTTP instead,
				// or just close the WebSocket connection if we're using that
				if(websockets) {
					ws.onclose = null;
					ws.close();
					ws = null;
				} else {
					navigator.sendBeacon(server + "/" + sessionId, JSON.stringify(request));
				}
				Janus.log("Destroyed session:");
				sessionId = null;
				connected = false;
				callbacks.success();
				if(notifyDestroyed)
					gatewayCallbacks.destroyed();
				return;
			}
			if(websockets) {
				request["session_id"] = sessionId;

				let unbindWebSocket = function() {
					for(let eventName in wsHandlers) {
						ws.removeEventListener(eventName, wsHandlers[eventName]);
					}
					ws.removeEventListener('message', onUnbindMessage);
					ws.removeEventListener('error', onUnbindError);
					if(wsKeepaliveTimeoutId) {
						clearTimeout(wsKeepaliveTimeoutId);
					}
					ws.close();
				};

				let onUnbindMessage = function(event){
					let data = JSON.parse(event.data);
					if(data.session_id == request.session_id && data.transaction == request.transaction) {
						unbindWebSocket();
						callbacks.success();
						if(notifyDestroyed)
							gatewayCallbacks.destroyed();
					}
				};
				let onUnbindError = function() {
					unbindWebSocket();
					callbacks.error("Failed to destroy the server: Is the server down?");
					if(notifyDestroyed)
						gatewayCallbacks.destroyed();
				};

				ws.addEventListener('message', onUnbindMessage);
				ws.addEventListener('error', onUnbindError);

				if(ws.readyState === 1) {
					ws.send(JSON.stringify(request));
				} else {
					onUnbindError();
				}

				return;
			}
			Janus.httpAPICall(server + "/" + sessionId, {
				verb: 'POST',
				withCredentials: withCredentials,
				body: request,
				success: function(json) {
					Janus.log("Destroyed session:");
					Janus.debug(json);
					sessionId = null;
					connected = false;
					if(json["janus"] !== "success") {
						Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
					}
					callbacks.success();
					if(notifyDestroyed)
						gatewayCallbacks.destroyed();
				},
				error: function(textStatus, errorThrown) {
					Janus.error(textStatus + ":", errorThrown);	// FIXME
					// Reset everything anyway
					sessionId = null;
					connected = false;
					callbacks.success();
					if(notifyDestroyed)
						gatewayCallbacks.destroyed();
				}
			});
		}

		// Private method to create a plugin handle
		function createHandle(callbacks) {
			callbacks = callbacks || {};
			callbacks.success = (typeof callbacks.success == "function") ? callbacks.success : Janus.noop;
			callbacks.error = (typeof callbacks.error == "function") ? callbacks.error : Janus.noop;
			callbacks.dataChannelOptions = callbacks.dataChannelOptions || { ordered: true };
			callbacks.consentDialog = (typeof callbacks.consentDialog == "function") ? callbacks.consentDialog : Janus.noop;
			callbacks.connectionState = (typeof callbacks.connectionState == "function") ? callbacks.connectionState : Janus.noop;
			callbacks.iceState = (typeof callbacks.iceState == "function") ? callbacks.iceState : Janus.noop;
			callbacks.mediaState = (typeof callbacks.mediaState == "function") ? callbacks.mediaState : Janus.noop;
			callbacks.webrtcState = (typeof callbacks.webrtcState == "function") ? callbacks.webrtcState : Janus.noop;
			callbacks.slowLink = (typeof callbacks.slowLink == "function") ? callbacks.slowLink : Janus.noop;
			callbacks.onmessage = (typeof callbacks.onmessage == "function") ? callbacks.onmessage : Janus.noop;
			callbacks.onlocaltrack = (typeof callbacks.onlocaltrack == "function") ? callbacks.onlocaltrack : Janus.noop;
			callbacks.onremotetrack = (typeof callbacks.onremotetrack == "function") ? callbacks.onremotetrack : Janus.noop;

		// Private method to send a message
		function sendMessage(handleId, callbacks) {
			callbacks = callbacks || {};
			callbacks.success = (typeof callbacks.success == "function") ? callbacks.success : Janus.noop;
			callbacks.error = (typeof callbacks.error == "function") ? callbacks.error : Janus.noop;
			if(!connected) {
				Janus.warn("Is the server down? (connected=false)");
				callbacks.error("Is the server down? (connected=false)");
				return;
			}
			let pluginHandle = pluginHandles.get(handleId);
			if(!pluginHandle || !pluginHandle.webrtcStuff) {
				Janus.warn("Invalid handle");
				callbacks.error("Invalid handle");
				return;
			}
			let message = callbacks.message;
			let jsep = callbacks.jsep;
			let transaction = Janus.randomString(12);
			let request = { "janus": "message", "body": message, "transaction": transaction };
			if(pluginHandle.token)
				request["token"] = pluginHandle.token;
			if(apisecret)
				request["apisecret"] = apisecret;
			if(jsep) {
				request.jsep = {
					type: jsep.type,
					sdp: jsep.sdp
				};
				if(jsep.e2ee)
					request.jsep.e2ee = true;
				if(jsep.rid_order === "hml" || jsep.rid_order === "lmh")
					request.jsep.rid_order = jsep.rid_order;
				if(jsep.force_relay)
					request.jsep.force_relay = true;
				// Check if there's SVC video streams to tell Janus about
				let svc = null;
				let config = pluginHandle.webrtcStuff;
				if(config.pc) {
					let transceivers = config.pc.getTransceivers();
					if(transceivers && transceivers.length > 0) {
						for(let mindex in transceivers) {
							let tr = transceivers[mindex];
							if(tr && tr.sender && tr.sender.track && tr.sender.track.kind === 'video') {
								let params = tr.sender.getParameters();
								if(params && params.encodings && params.encodings.length === 1 &&
										params.encodings[0] && params.encodings[0].scalabilityMode) {
									// This video stream uses SVC
									if(!svc)
										svc = [];
									svc.push({
										mindex: parseInt(mindex),
										mid: tr.mid,
										svc: params.encodings[0].scalabilityMode
									});
								}
							}
						}
					}
				}
				if(svc)
					request.jsep.svc = svc;
			}
			Janus.debug("Sending message to plugin (handle=" + handleId + "):");
			Janus.debug(request);
			if(websockets) {
				request["session_id"] = sessionId;
				request["handle_id"] = handleId;
				transactions.set(transaction, function(json) {
					Janus.debug("Message sent!");
					Janus.debug(json);
					if(json["janus"] === "success") {
						// We got a success, must have been a synchronous transaction
						let plugindata = json["plugindata"];
						if(!plugindata) {
							Janus.warn("Request succeeded, but missing plugindata...");
							callbacks.success();
							return;
						}
						Janus.log("Synchronous transaction successful (" + plugindata["plugin"] + ")");
						let data = plugindata["data"];
						Janus.debug(data);
						callbacks.success(data);
						return;
					} else if(json["janus"] !== "ack") {
						// Not a success and not an ack, must be an error
						if(json["error"]) {
							Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
							callbacks.error(json["error"].code + " " + json["error"].reason);
						} else {
							Janus.error("Unknown error");	// FIXME
							callbacks.error("Unknown error");
						}
						return;
					}
					// If we got here, the plugin decided to handle the request asynchronously
					callbacks.success();
				});
				ws.send(JSON.stringify(request));
				return;
			}
			Janus.httpAPICall(server + "/" + sessionId + "/" + handleId, {
				verb: 'POST',
				withCredentials: withCredentials,
				body: request,
				success: function(json) {
					Janus.debug("Message sent!");
					Janus.debug(json);
					if(json["janus"] === "success") {
						// We got a success, must have been a synchronous transaction
						let plugindata = json["plugindata"];
						if(!plugindata) {
							Janus.warn("Request succeeded, but missing plugindata...");
							callbacks.success();
							return;
						}
						Janus.log("Synchronous transaction successful (" + plugindata["plugin"] + ")");
						let data = plugindata["data"];
						Janus.debug(data);
						callbacks.success(data);
						return;
					} else if(json["janus"] !== "ack") {
						// Not a success and not an ack, must be an error
						if(json["error"]) {
							Janus.error("Ooops: " + json["error"].code + " " + json["error"].reason);	// FIXME
							callbacks.error(json["error"].code + " " + json["error"].reason);
						} else {
							Janus.error("Unknown error");	// FIXME
							callbacks.error("Unknown error");
						}
						return;
					}
					// If we got here, the plugin decided to handle the request asynchronously
					callbacks.success();
				},
				error: function(textStatus, errorThrown) {
					Janus.error(textStatus + ":", errorThrown);	// FIXME
					callbacks.error(textStatus + ": " + errorThrown);
				}
			});
		}
