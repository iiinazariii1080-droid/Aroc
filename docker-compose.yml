# ============================================================================
# Root Docker Compose — full robot stack orchestration
#
# Usage:
#   cp .env.example .env          # fill in real values
#   docker compose up -d          # start all services
#   docker compose up -d --build  # rebuild & start
#   docker compose logs -f        # follow logs
#
# For production hardening, layer the prod override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &hc-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  # ---------- Autoheal (restart unhealthy containers) ----------
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

  # ---------- API Gateway (reverse proxy / aggregator) ----------
  api-gateway:
    build:
      context: .
      dockerfile: api_gateway_service/Dockerfile
    container_name: api-gateway
    env_file: .env
    environment:
      PORT: ${API_GATEWAY_PORT:-8201}
      WEB_CONCURRENCY: 1
      READINESS_CHECK_SERVICES: 0
      READINESS_CHECK_AUTH: 0
      SERVICE_SYMOVO_CONCURRENCY: 5
      HTTP_MAX_CONNECTIONS: 50
      HTTP_MAX_KEEPALIVE_CONNECTIONS: 40
      HTTP_KEEPALIVE_EXPIRY: 120
      CAM_MAX_CONNECTIONS: 30
      CAM_MAX_KEEPALIVE: 25
      SERVICE_MAP_JSON: '{"depth_map":{"url":"http://${HOST_LAN_IP:-192.168.1.10}:${COLOR_CAMERA_PORT:-8900}","prefix":"/api/v1/depth_map"}}'
    ports:
      - "${API_GATEWAY_PORT:-8201}:${API_GATEWAY_PORT:-8201}"
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${API_GATEWAY_PORT:-8201}/readyz"]
    logging: *default-logging
    networks:
      - robot-net

  # ---------- Igus Lift Service ----------
  # NOTE: network_mode: host required for Modbus/TCP to physical motor on LAN
  igus-service:
    build:
      context: .
      dockerfile: igus_service/Dockerfile
    container_name: igus-service
    env_file: .env
    network_mode: host
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: ${IGUS_PORT:-8101}
      IGUS_MOTOR_IP: ${IGUS_MOTOR_IP:-192.168.1.230}
      IGUS_MOTOR_PORT: ${IGUS_MOTOR_PORT:-502}
      DRYVE_HOST: ${IGUS_MOTOR_IP:-192.168.1.230}
      DRYVE_PORT: ${IGUS_MOTOR_PORT:-502}
      DRYVE_UNIT_ID: ${DRYVE_UNIT_ID:-0}
      DRYVE_ALLOW_TID_MISMATCH: ${DRYVE_ALLOW_TID_MISMATCH:-0}
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:${IGUS_PORT:-8101}/health"]
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  # ---------- xArm Service ----------
  xarm-service:
    build:
      context: .
      dockerfile: xarm_service/Dockerfile
    container_name: xarm-service
    env_file: .env
    environment:
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: ${XARM_PORT:-8102}
      XARM_IP: ${XARM_HARDWARE_IP:-192.168.1.220}
      DEPTH_CAMERA_IP: ${DEPTH_CAMERA_IP:-192.168.1.55}
      WS_CHECK_DISABLED: "1"
    ports:
      - "${XARM_PORT:-8102}:${XARM_PORT:-8102}"
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:${XARM_PORT:-8102}/healthz"]
    logging: *default-logging
    networks:
      - robot-net

  # ---------- Robot Service (main orchestrator) ----------
  robot-service:
    build:
      context: .
      dockerfile: robot_service/Dockerfile
    container_name: robot-service
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UVICORN_WORKERS: "1"
      SERVER_IP: ${HOST_LAN_IP:-192.168.1.10}
      IGUS_CONTAINER_IP: ${HOST_LAN_IP:-192.168.1.10}
      IGUS_CONTAINER_PORT: ${IGUS_PORT:-8101}
      XARM_CONTAINER_IP: ${HOST_LAN_IP:-192.168.1.10}
      XARM_CONTAINER_PORT: ${XARM_PORT:-8102}
      SYMOVO_CONTAINER_IP: ${HOST_LAN_IP:-192.168.1.10}
      SYMOVO_CONTAINER_PORT: ${SYMOVO_PORT:-7905}
      SYMOVO_NAV2ADAPTER_HOST: ${HOST_LAN_IP:-192.168.1.10}
      SYMOVO_ROBOT_ID: ${SYMOVO_ROBOT_ID:-fahrdummy-01}
      DEPTH_CAMERA_CONTAINER_IP: ${DEPTH_CAMERA_IP:-192.168.1.55}
      DEPTH_CAMERA_CONTAINER_PORT: "8900"
      XARM_WS_URL: "ws://${XARM_HARDWARE_IP:-192.168.1.220}:${XARM_WS_PORT:-18333}/ws?channel=prod&lang=en&v=1&id=robot"
      ROBOT_DB_PATH: /app/data/database.db
    ports:
      - "${ROBOT_PORT:-8110}:${ROBOT_PORT:-8110}"
    volumes:
      - robot-service-data:/app/data
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:${ROBOT_PORT:-8110}/healthz"]
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - robot-net

  # ---------- Nav2 Adapter (Symovo AGV) ----------
  symovo-service:
    build:
      context: .
      dockerfile: nav2adapter/Dockerfile
    container_name: symovo-service
    env_file: .env
    environment:
      PERSISTENCE_PATH: /app/data/state.json
    volumes:
      - robot-service-data:/app/data
    ports:
      - "${SYMOVO_PORT:-7905}:${SYMOVO_PORT:-7905}"
      - "${TELEOP_PORT:-7906}:${TELEOP_PORT:-7906}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SYMOVO_PORT:-7905}/livez || exit 1"]
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - robot-net

  # ---------- MQTT: Config API (internal broker config store) ----------
  mqtt-config-api:
    build:
      context: ./mqtt_command_service
      dockerfile: config-api/Dockerfile
    container_name: mqtt-config-api
    volumes:
      - mqtt-config-data:/data
      - mqtt-certs:/certs
    environment:
      API_PORT: "8100"
      CONFIG_FILE_PATH: /data/config.json
      CERT_DIR: /certs
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Seed broker config from root .env on first start
      MQTT_BROKER: ${MQTT_BROKER:-82.165.177.194}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USER: ${MQTT_USER:-bridge_user}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_USE_TLS: ${MQTT_USE_TLS:-true}
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    networks:
      - robot-net

  # ---------- MQTT: Hub Auth (JWT token management) ----------
  mqtt-hub-auth:
    build:
      context: ./mqtt_command_service
      dockerfile: hub-auth/Dockerfile
    container_name: mqtt-hub-auth
    depends_on:
      mqtt-config-api:
        condition: service_healthy
    environment:
      API_PORT: "8101"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      HUB_BASE_URL: ${HUB_BASE_URL:-}
      HUB_ROBOT_ID: ${HUB_ROBOT_ID:-}
      HUB_API_KEY: ${HUB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    networks:
      - robot-net

  # ---------- MQTT: Bridge (command relay) ----------
  mqtt-bridge:
    build:
      context: ./mqtt_command_service
      dockerfile: mqtt-bridge/Dockerfile
    container_name: mqtt-bridge
    depends_on:
      mqtt-config-api:
        condition: service_healthy
      mqtt-hub-auth:
        condition: service_healthy
    volumes:
      - mqtt-certs:/certs:ro
    environment:
      CONFIG_API_URL: http://mqtt-config-api:8100
      HUB_AUTH_URL: http://mqtt-hub-auth:8101
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ROBOT_ID: ${ROBOT_ID:-robot-01}
      ROBOT_SERVICE_URL: http://${HOST_LAN_IP:-192.168.1.10}:${ROBOT_PORT:-8110}
      IGUS_SERVICE_URL: http://${HOST_LAN_IP:-192.168.1.10}:${IGUS_PORT:-8101}
      XARM_SERVICE_URL: http://${HOST_LAN_IP:-192.168.1.10}:${XARM_PORT:-8102}
      SYMOVO_SERVICE_URL: http://${HOST_LAN_IP:-192.168.1.10}:${SYMOVO_PORT:-7905}
      MQTT_PUBLISH_QOS: "1"
      STATUS_HEARTBEAT_INTERVAL: "15.0"
      ALLOW_MQTT_TLS_INSECURE: "true"  # Temporary: until 8883 switches to AROC CA
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "python", "-c", "import os, time; st = os.stat('/tmp/healthy'); exit(0 if time.time() - st.st_mtime < 30 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - robot-net

  # ---------- MQTT: Telemetry (status publisher) ----------
  mqtt-telemetry:
    build:
      context: ./mqtt_command_service
      dockerfile: mqtt-telemetry/Dockerfile
    container_name: mqtt-telemetry
    depends_on:
      mqtt-config-api:
        condition: service_healthy
    volumes:
      - mqtt-certs:/certs:ro
    environment:
      CONFIG_API_URL: http://mqtt-config-api:8100
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ROBOT_ID: ${ROBOT_ID:-robot-01}
      LOCAL_IP: ${HOST_LAN_IP:-192.168.1.10}
      POLL_INTERVAL_SECONDS: "5"
      DEPTH_CAMERA_IP: ${DEPTH_CAMERA_IP:-192.168.1.55}
      ALLOW_MQTT_TLS_INSECURE: "true"  # Temporary: until 8883 switches to AROC CA
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "python", "-c", "import os, time; st = os.stat('/tmp/healthy'); exit(0 if time.time() - st.st_mtime < 30 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    networks:
      - robot-net

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend_service
      dockerfile: Dockerfile
    container_name: frontend
    env_file: .env
    environment:
      PYTHONPATH: /app
      HOST: "0.0.0.0"
      PORT: ${FRONTEND_PORT:-8401}
      ALLOWED_ORIGINS: "*"
      API_GATEWAY_URL: "http://${HOST_LAN_IP:-192.168.1.10}:${API_GATEWAY_PORT:-8201}"
    ports:
      - "${FRONTEND_PORT:-8401}:${FRONTEND_PORT:-8401}"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - robot-net

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  robot-service-data:
  mqtt-config-data:
  mqtt-certs:

# ── Network ─────────────────────────────────────────────────────────────────
networks:
  robot-net:
    driver: bridge
